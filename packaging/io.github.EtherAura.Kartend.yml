# runtime-version below is the org.kde.Platform (KDE/Qt) runtime, NOT the
# Kartend app version. It is intentionally decoupled from VERSION/semver, so
# .scripts/bump-version.sh deliberately does not touch it — bump it only as a
# conscious migration to a newer KDE runtime. Kartend builds against three
# different Qt versions across targets; keep this in mind when changing
# Qt-version-sensitive code:
#   - Linux CI (the conformance floor): Qt 6.4 (ubuntu-24.04 qt6-base-dev), see .github/workflows/build.yml
#   - Windows release:                  Qt 6.7 LTS (install-qt-action),    see .github/workflows/build.yml
#   - Flatpak runtime (this file):      Qt 6.8 (org.kde.Platform 6.8)
app-id: io.github.EtherAura.Kartend
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
command: kartend
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=home
  - --filesystem=/media
  - --filesystem=/run/media
modules:
  - name: kartend
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
      - -DKARTEND_BUILD_TESTS=OFF
      - -DKARTEND_ENABLE_CCACHE=OFF
      - -DKARTEND_MAINTENANCE=OFF
      - -DKARTEND_PORTABLE_RELEASE=ON
    sources:
      - type: dir
        path: ..
