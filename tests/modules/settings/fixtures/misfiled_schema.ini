; Misfiled-schema INI: the schemaVersion sentinel lives in [ScraperOptions]
; instead of [General]. Represents a settings file written by an early build
; that stamped the file-wide schema sentinel into the wrong group (save wrote
; it under [ScraperOptions] while load read it from [General], so every load
; mistook the file for unversioned/v0). The tolerant dual-location read must
; pick up the [ScraperOptions] copy and treat the file as its TRUE version —
; kept equal to the build's current version so recognition shows up as
; silence (no migration fires). Bump alongside kSettingsSchemaVersion.
[General]
rememberSelection=true
pixmapCacheSizeMB=64
titleTintSaturation=200

[ScraperOptions]
schemaVersion=3
