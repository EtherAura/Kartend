; Misfiled-schema INI: schemaVersion=1 lives in [ScraperOptions] instead of
; [General]. Represents a settings file written by an early build that stamped
; the file-wide schema sentinel into the wrong group (save wrote it under
; [ScraperOptions] while load read it from [General], so every load mistook the
; file for unversioned/v0). The tolerant dual-location read must pick up the
; [ScraperOptions] copy, treat the file as schemaVersion 1, and therefore NOT
; fire the v0->v1 migration.
[General]
rememberSelection=true
pixmapCacheSizeMB=64
titleTintSaturation=200

[ScraperOptions]
schemaVersion=1
