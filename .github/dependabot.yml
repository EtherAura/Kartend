version: 2
updates:
  - package-ecosystem: "github-actions"
    # "/" only covers .github/workflows/ plus a ROOT-level action.yml — it does
    # NOT reach composite actions under .github/actions/<name>/action.yml, so
    # their pins would rot silently. That already bit us once: Dependabot
    # bumped actions/cache to v6 across the workflows (#72) and the
    # windows-build composite action had to be fixed by hand afterwards
    # (cce8c3b5). The glob keeps every present and future composite action
    # covered. `directories` (plural) is what supports globbing; `directory`
    # does not.
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
    # One PR per weekly sweep, not one per action. Split PRs mean split merge
    # commits, and paired actions break in the gap between them: merging the
    # codeql-action/init 4.37.9 bump ahead of its analyze twin left main's
    # fa08572f with a mismatched pair, and its CodeQL run failed with "Loaded
    # a configuration file for version '4.37.9', but running version
    # '4.37.7'". No merge ORDER avoids that — one of the two intermediate
    # states always exists — so the fix is for related bumps to land as a
    # single commit.
    groups:
      github-actions:
        patterns:
          - "*"
  # Python tooling for QR-code / image generation (.scripts/requirements.txt).
  # Pinned with == so Dependabot can track Pillow's steady CVE stream.
  - package-ecosystem: "pip"
    directory: "/.scripts"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
