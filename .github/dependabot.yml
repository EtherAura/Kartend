version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    labels:
      - "ci"
      - "dependencies"
  # Python tooling for QR-code / image generation (.scripts/requirements.txt).
  # Pinned with == so Dependabot can track Pillow's steady CVE stream.
  - package-ecosystem: "pip"
    directory: "/.scripts"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
