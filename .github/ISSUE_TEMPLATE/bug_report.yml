name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Kartend
        2. Navigate to '...'
        3. Click '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        - OS: e.g. Arch Linux 6.x
        - Qt version: e.g. 6.7
        - Kartend version: e.g. 0.0.1
        - Desktop: e.g. KDE Plasma 6
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / debug output
      description: Run Kartend with `QT_LOGGING_RULES="kartend.*=true"` and paste relevant output.
      render: shell
    validations:
      required: false
