name: Script lint
description: >
  Fast, build-independent preflight: shellcheck, the pinned clang-format
  check, the python/metadata guardrails, and the translation drift check.
  Extracted from build.yml's script-lint job so the same step sequence can
  run both as the REQUIRED `script-lint` check there (main/develop pushes +
  PRs) and as branch-lint.yml's feature-branch push gate — without the two
  copies drifting. Expects the repo to be checked out already.

runs:
  using: composite
  steps:
    - name: Verify pinned clang-format version
      # Kartend-gv2xq: the clang-format major version lives in exactly one
      # place — .scripts/lib/clang-format-version.sh. The package name and
      # check command below still spell "19" literally (apt needs the
      # literal package name), so assert they match the source of truth and
      # fail loud if the file is bumped without updating this action.
      shell: bash
      run: |
        PINNED="$(. .scripts/lib/clang-format-version.sh && echo "$KARTEND_CLANG_FORMAT_VERSION")"
        if [ "$PINNED" != "19" ]; then
          echo "::error::clang-format pin is $PINNED in .scripts/lib/clang-format-version.sh but this action hardcodes clang-format-19. Update .github/actions/script-lint/action.yml + Dockerfile.ci + ci-local.sh to clang-format-$PINNED."
          exit 1
        fi

    - name: Install lint dependencies
      # qt6-l10n-tools ships lupdate for the translation drift check below
      # (Kartend-pnlot.3); it pulls only Qt core libs, no GUI stack.
      #
      # Kartend-j94zp: this was a bare `apt-get install` while install-deps
      # had carried Acquire retry/timeout hardening since Kartend-cqnsi. The
      # gap cost a whole run: apt took ~7 minutes to produce its first byte,
      # then stalled mid-download on libllvm15t64 from azure.archive.ubuntu.com
      # until branch-lint's 10-minute timeout-minutes killed the job (run
      # 30912927057). Every check below was reported `skipped` and the branch
      # went red with zero lint signal. Route through install-deps rather than
      # copying the -o flags here, so there is ONE hardened apt path to keep
      # current instead of two that drift apart again.
      uses: ./.github/actions/install-deps
      with:
        packages: shellcheck clang-format-19 appstream desktop-file-utils qt6-l10n-tools
        # These five need no recommends, and install-deps runs an
        # `apt-get update` this step used to skip — ~5s, and what makes
        # local `act` reproduction via .scripts/ci-local.sh work at all.
        no-install-recommends: 'true'
        # Well under branch-lint's 10-minute job timeout so a crawling
        # mirror surfaces as install-deps' labelled timeout error, not an
        # opaque job cancellation (Kartend-wym32). These five packages
        # install in well under a minute on a healthy mirror.
        install-timeout-seconds: '300'

    - name: Shellcheck
      # -x follows `source` directives into .scripts/lib/*.sh so build.sh is
      # analysed with its modules inlined (cross-file globals resolve). The
      # lib files are linted directly too; each documents a
      # disable=SC2154,SC2034 because those two checks can't see the
      # build.sh-owned globals when a module is linted in isolation.
      shell: bash
      run: |
        shellcheck --version
        shellcheck -x .scripts/*.sh .scripts/lib/*.sh \
          .scripts/git-hooks/pre-commit .scripts/git-hooks/pre-push .scripts/git-hooks/install.sh

    - name: clang-format check (v19 pin)
      # Kartend-cifqk: moved out of maintenance-check — the format check is
      # purely file-based (no compdb), so failing it behind a ~52-minute
      # clang build wasted an hour per drifted PR. Same v19 pin + file walk
      # as .scripts/lib/quality.sh's do_clang_format, but ENFORCING.
      shell: bash
      run: |
        clang-format-19 --version
        fail=0
        while IFS= read -r -d '' file; do
          if ! clang-format-19 --style=file --dry-run --Werror "$file" >/dev/null 2>&1; then
            echo "::error file=$file::not formatted with clang-format-19 (run .scripts/build.sh --format-apply)"
            fail=1
          fi
        done < <(find src tests \( -name '*.cpp' -o -name '*.h' \) -print0)
        exit $fail

    - name: Check module layering
      # Build-independent guardrail (moved from maintenance-check,
      # Kartend-cifqk — same below).
      shell: bash
      run: python3 .scripts/check-layering.py

    - name: Check QTimer::singleShot 'why' comments
      shell: bash
      run: python3 .scripts/check-singleshot-comments.py

    - name: Check src/modules ↔ tests/modules mapping
      shell: bash
      run: python3 .scripts/check-test-mapping.py

    - name: Check bd issue ID leakage to user-facing surfaces
      shell: bash
      run: python3 .scripts/check-bd-id-leakage.py

    - name: Check required-checks path lists stay in lockstep
      shell: bash
      run: python3 .scripts/check-required-checks-consistency.py

    - name: Self-test the gatekeeper lint scripts
      shell: bash
      run: python3 .scripts/tests/test_lint_scripts.py

    - name: Validate AppStream + desktop metadata
      shell: bash
      run: |
        appstreamcli validate --pedantic packaging/*.metainfo.xml
        desktop-file-validate packaging/*.desktop

    - name: Check translation-source drift (lupdate)
      # Kartend-pnlot.3: translations/kartend_en.ts (the translator seed) is
      # refreshed manually — `cmake --build <builddir> --target
      # update_translations` — which is easy to forget after touching tr()
      # strings, and nothing else in CI runs lupdate at all. Cheap,
      # configure-less cross-check: run lupdate straight over src/ into a
      # temp .ts and compare message counts against the committed seed.
      #
      # Kartend-ny9fy: this was a ::warning for fear that a project-less
      # lupdate walk might not match the CMake qt_add_lupdate extraction,
      # making a mismatch unable to prove staleness. That caution backfired:
      # the step reported a real two-message delta on every main run for
      # weeks and everyone ignored it because the job stayed green, while
      # two user-facing strings sat untranslatable (Kartend-6gig9).
      #
      # It is now fatal. The two extractions can only diverge over files
      # lupdate sees but the build does not, and src/ has no platform-gated
      # sources at all — no if(WIN32)/if(APPLE) in any src/ CMakeLists — so
      # the walk and the target cover the same files. The one way they do
      # diverge, a file missing from target_sources, is itself the bug this
      # check exists to catch, so failing on it is correct rather than a
      # false positive. If platform-conditional sources are ever added,
      # revisit: the honest fix then is to drive the check from the
      # generated <build>/.lupdate project instead of a bare walk.
      shell: bash
      run: |
        # lupdate lands in different places per distro: on PATH, as
        # lupdate6 (Arch), or off PATH in /usr/lib/qt6/bin (Debian/Ubuntu's
        # qt6-l10n-tools) — try each so the snippet also runs locally.
        LUPDATE="$(command -v lupdate || command -v lupdate6 || true)"
        if [ -z "$LUPDATE" ] && [ -x /usr/lib/qt6/bin/lupdate ]; then
          LUPDATE=/usr/lib/qt6/bin/lupdate
        fi
        if [ -z "$LUPDATE" ]; then
          echo "::warning::lupdate not found (qt6-l10n-tools missing from the lint dependencies?) — translation drift check skipped."
          exit 0
        fi
        "$LUPDATE" -silent -recursive src -ts "$RUNNER_TEMP/kartend_fresh.ts"
        # Kartend-376w7: the gate compares SOURCE STRINGS, not raw message
        # counts or (context, source) pairs. Different lupdate generations can
        # file the same string under different contexts — the runner's older
        # lupdate mis-scopes a trailing-return-type method into its return
        # type's class ([QMessageBox] instead of [SettingsDialog]) — so a
        # pair-level compare would go red on parser noise no seed refresh can
        # fix, while the old count compare both passed that swap silently and
        # missed a count-neutral add+remove pair entirely. Source-level sets
        # catch real drift in both directions and stay immune to cross-version
        # context reassignment; context-only disagreements are printed as an
        # informational note so they read as "context differs, not missing".
        # Known blind spot, accepted with the looser compare: a string whose
        # text already exists under another context (e.g. a second panel
        # gaining its own "Background" label) shows up only in that note, not
        # as a failure — the price of not going red on parser noise the seed
        # cannot fix. Kartend-6gig9 still applies: name the actual strings,
        # not counts — the offender list is what makes the log actionable.
        if ! python3 - "$RUNNER_TEMP/kartend_fresh.ts" translations/kartend_en.ts <<'PYEOF'
        import sys, xml.etree.ElementTree as ET

        def messages(path, skip_stale=False):
            # source string -> {contexts it appears under, first location}.
            # vanished/obsolete seed entries are kept for translators but
            # correspond to no current source string — excluded (counted).
            root, out, stale = ET.parse(path).getroot(), {}, 0
            for ctx in root.findall('context'):
                name = ctx.findtext('name') or ''
                for m in ctx.findall('message'):
                    if skip_stale:
                        tr = m.find('translation')
                        if tr is not None and tr.get('type') in ('vanished', 'obsolete'):
                            stale += 1
                            continue
                    loc = m.find('location')
                    where = f"{loc.get('filename')}:{loc.get('line')}" if loc is not None else '?'
                    entry = out.setdefault(m.findtext('source') or '', {'contexts': set(), 'where': where})
                    entry['contexts'].add(name)
            return out, stale

        fresh, _ = messages(sys.argv[1])
        seed, stale = messages(sys.argv[2], skip_stale=True)
        print(f"Fresh lupdate extract: {len(fresh)} unique source strings; "
              f"committed kartend_en.ts: {len(seed)} live ({stale} vanished/obsolete messages excluded).")

        ctx_diffs = {s for s in fresh.keys() & seed.keys() if fresh[s]['contexts'] != seed[s]['contexts']}
        if ctx_diffs:
            print(f"\nNote: {len(ctx_diffs)} string(s) filed under different contexts by this lupdate "
                  "than in the seed — a cross-Qt-version parse artifact, NOT drift (Kartend-376w7):")
            for s in sorted(ctx_diffs):
                print(f"  {s!r}: extract {sorted(fresh[s]['contexts'])} vs seed {sorted(seed[s]['contexts'])}")

        failed = False
        for label, side, delta, hint in (
            ("in source but MISSING from the seed", fresh, sorted(fresh.keys() - seed.keys()),
             "these strings cannot be translated at all today"),
            ("in the seed but NO LONGER in source", seed, sorted(seed.keys() - fresh.keys()),
             "these are leftovers a refresh would drop"),
        ):
            if not delta:
                continue
            failed = True
            print(f"\n{len(delta)} string(s) {label} ({hint}):")
            for s in delta:
                print(f"  [{'/'.join(sorted(side[s]['contexts']))}] {s!r}\n      {side[s]['where']}")
        sys.exit(1 if failed else 0)
        PYEOF
        then
          echo "::error file=translations/kartend_en.ts::Translation seed is stale: a fresh lupdate extract over src/ disagrees with the committed kartend_en.ts. See the string list above."
          echo "Two things cause this, and they need different fixes:"
          echo "  1. The seed was not refreshed after tr()/translate() strings changed."
          echo "     Fix: cmake --build <builddir> --target update_translations, then commit translations/kartend_en.ts (docs/dev/i18n.md)."
          echo "  2. A source file is missing from target_sources in its directory's CMakeLists.txt."
          echo "     qt_add_lupdate only scans files listed there, so refreshing will NOT help — the strings"
          echo "     can never reach the seed. This is Kartend-6gig9: two header-only formatters were left out"
          echo "     of src/utils/view/CMakeLists.txt and stayed untranslatable across two seed refreshes."
          echo "     If a refresh does not clear this, check that every file named above is listed."
          exit 1
        fi
