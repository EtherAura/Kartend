name: 'Install Kartend build dependencies'
description: >-
  Installs apt packages required for a Kartend CI job. Each job specifies its
  own package list so we don't pay for packages it doesn't need (e.g. coverage
  doesn't need libzstd-dev).

  This used to wrap awalsh128/cache-apt-pkgs-action to cache the .deb
  downloads, but that action pinned actions/cache/restore@v4 and
  actions/upload-artifact@v4 (Node 20), which GitHub forces off the runners
  starting 2026-09-16. Direct `apt-get install` keeps us first-party-only with
  no Node-20 transitive deps; the cache restore the wrapper used to do saved
  roughly 30-60s per job on a hit, which is acceptable to give up to drop the
  third-party dependency.

inputs:
  packages:
    description: >-
      Space-separated list of apt packages to install (e.g.
      "cmake ninja-build qt6-base-dev libqt6sql6-sqlite").
    required: true
  no-install-recommends:
    description: >-
      Pass --no-install-recommends to the install. Defaults to "false" —
      apt's own default, and what every build job has always used — so
      adding this input does not change the dependency closure any
      existing caller sees. script-lint sets it to "true": its five lint
      tools need no recommends, and every megabyte it does not download
      is a megabyte a stalled mirror cannot hang on (Kartend-j94zp).
    required: false
    default: 'false'
  install-timeout-seconds:
    description: >-
      Hard bound (seconds) on the `apt-get install` invocation, enforced
      with `timeout` because GitHub does not support timeout-minutes on
      composite-action steps (Kartend-wym32). The Acquire options only
      catch stalls and failures; a slow-but-alive mirror trickling bytes
      needs this wall-clock bound to fail as a labelled dependency
      problem instead of an opaque job cancellation. Callers whose job
      timeout is tight should pass a value comfortably below it so the
      label — not the job kill — is what surfaces (script-lint passes
      300 under its 10-minute job).
    required: false
    default: '600'

runs:
  using: 'composite'
  steps:
    # Refresh apt lists before install. Real GHA runners ship with a populated
    # apt index, but act's catthehacker/ubuntu:full-24.04 image prunes the
    # lists, so a truly fresh `act` run would fail with "Unable to locate
    # package clang" without this. Cheap (~5s) on real CI and required for
    # local `act` reproduction via .scripts/ci-local.sh.
    - name: Update apt package index
      shell: bash
      # Retry once after a short pause so a transient mirror failure surfaces
      # apt's own network error rather than a confusing "Unable to locate
      # package" in the install step further down.
      #
      # Kartend-cqnsi: the apt -o flags harden against a stalled mirror
      # (azure.archive.ubuntu.com once hung ~29 min on a single connection and
      # burned a whole 30-min job). Acquire::Retries makes apt retry a failed
      # fetch itself, and the short http/https Timeout turns a silent stall
      # into a fast failure that the retry can route around, instead of a hang
      # that only the job's timeout-minutes eventually kills.
      run: |
        # Kartend audit xm8wu: the hosted ubuntu-24.04 image ships azure-cli /
        # microsoft-prod apt repos that intermittently 403 or report "no longer
        # signed", which fails this update outright (it took build-no-zstd red on
        # main). Nothing here needs them, so drop the sources before refreshing
        # the index. -f keeps it a no-op when they are absent (e.g. act's image).
        #
        # Kartend-wym32: `timeout` bounds each attempt because the Acquire
        # timeouts fire only on INACTIVITY — a mirror trickling bytes trips
        # neither them nor Acquire::Retries, and an unbounded update would eat
        # into the install's budget. A healthy update takes ~5s; 120s is
        # mirror-weather headroom, and the existing retry gives a second
        # attempt a fresh connection to route around the sick backend.
        sudo rm -f /etc/apt/sources.list.d/microsoft* /etc/apt/sources.list.d/azure-cli*
        timeout 120 sudo apt-get $APT_OPTS update -qq \
          || { sleep 5; timeout 120 sudo apt-get $APT_OPTS update -qq; }
      env:
        APT_OPTS: >-
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30

    - name: Install apt packages
      shell: bash
      # DEBIAN_FRONTEND=noninteractive prevents tzdata/etc. from prompting if
      # any of the requested packages pulls them in transitively. Recommends
      # are left at apt's default (installed) unless a caller opts out via
      # no-install-recommends — the previous cache wrapper also installed
      # them, and dropping them for everyone would silently change the
      # dependency closure each job sees. APT_OPTS mirrors the update step
      # (Kartend-cqnsi) so the package downloads get the same retry/timeout
      # resilience as the index refresh.
      # Kartend-wym32: the Acquire timeouts fire only on INACTIVITY and
      # Acquire::Retries only on FAILURE, so a slow-but-alive mirror trickling
      # bytes trips neither — build-no-zstd once burned its entire 30-minute
      # job budget inside this step and died as an unexplained "cancelled".
      # GitHub does not support timeout-minutes on composite-action steps, so
      # an explicit `timeout` bounds the install instead: a healthy install
      # takes ~1-3 min, and on the 600s kill the step fails as a clearly
      # labelled dependency problem rather than an opaque job cancellation.
      # No retry after the kill — a SIGTERM mid-dpkg can leave dpkg needing
      # `--configure -a`, and a blind rerun would fail more confusingly than
      # the labelled timeout does.
      run: |
        status=0
        timeout "$INSTALL_TIMEOUT" \
          sudo DEBIAN_FRONTEND=noninteractive apt-get $APT_OPTS $RECOMMENDS_OPT install -y \
          ${{ inputs.packages }} || status=$?
        if [ "$status" -eq 124 ]; then
          echo "::error title=apt install timed out::Dependency install exceeded ${INSTALL_TIMEOUT}s — the apt mirror is crawling (Kartend-wym32). Re-run the job to get a different mirror backend."
        fi
        exit "$status"
      env:
        APT_OPTS: >-
          -o Acquire::Retries=3
          -o Acquire::http::Timeout=30
          -o Acquire::https::Timeout=30
        RECOMMENDS_OPT: ${{ inputs.no-install-recommends == 'true' && '--no-install-recommends' || '' }}
        INSTALL_TIMEOUT: ${{ inputs.install-timeout-seconds }}
