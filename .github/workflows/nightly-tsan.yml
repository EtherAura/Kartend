name: Nightly TSan

# Runs the ThreadSanitizer build + full ctest suite once per day on main, in
# addition to the per-PR TSan job in build.yml. Catches data races that only
# manifest under sustained or cold-cache timing — the per-PR run uses cached
# ccache state and runs the same tests, so a race triggered only by a fresh
# environment (or by tests interacting across many runs) may slip past it.
#
# A failure here opens a GitHub Issue tagged `tsan-nightly` so it stays
# visible even when nobody is watching the Actions tab. The issue carries an
# embedded evidence block (failed tests, first TSan report, per-test output
# tails) because the run log and the uploaded artifact both die if the run
# is deleted — the 2026-07-17 failure (GH#77) left nothing to triage.
#
# Also hosts the nightly benchmark job (Kartend-w9s8e): every other ctest
# invocation across the workflows passes `-LE benchmark`, so the QBENCHMARK
# suites compiled all along never executed in CI. The benchmarks job runs
# them once per night on a plain gcc Release build (NOT under TSan — the
# instrumentation overhead would swamp the numbers) and archives the
# per-slot results to the run's step summary for trend visibility. No hard
# thresholds: shared-runner wallclock is too noisy to gate on; the value is
# the visible day-over-day series.

on:
  schedule:
    # 03:17 UTC daily. Avoids the on-the-hour congestion windows that crowd
    # GitHub-hosted runner queues.
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-tsan
  cancel-in-progress: false

jobs:
  thread-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # Kartend-dbkuy: instrumented build of the full test set — same disk
      # profile as the PR-side sanitizer jobs in build.yml.
      - uses: ./.github/actions/free-disk-space

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: clang cmake ninja-build lld ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev qt6-image-formats-plugins libqt6sql6-sqlite libzstd-dev libarchive-dev qtkeychain-qt6-dev pulseaudio

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Cache ccache
        # Restore-keys deliberately includes the per-PR tsan key so the cold
        # cache scenario isn't entirely cold — we still benefit from
        # incremental compile of unchanged TUs. The primary key is
        # content-addressed (not github.run_id): nightlies are already
        # serialized by `concurrency`, so a unique-per-run key only forced a
        # fresh cache write each night and evicted PR caches (mirrors build.yml).
        uses: actions/cache@v6
        with:
          # Cache-key policy, and the accepted staleness that comes with
          # it, are documented once at the ccache step in build.yml
          # (Kartend-pcc65). Do not chase the hit rate here without
          # reading that first.
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-tsan-nightly-${{ hashFiles('CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-ccache-tsan-nightly-
            ${{ runner.os }}-ccache-tsan-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=2G
          # PCH-using compiles need this to be cacheable (Kartend-zhodi)
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      # No -DKARTEND_SLIM_DEBUG_INFO=ON: -g1 breaks the TSan suppressions (see
      # the KARTEND_SLIM_DEBUG_INFO block in CMakeLists.txt), and this tree is
      # ~3.5 GB so it has nothing to gain from it.
      - name: Configure CMake (Debug + TSan)
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p build/TSan
          cd build/TSan
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_ENABLE_TSAN=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build/TSan
          cmake --build . --parallel $(nproc)

      - name: ccache stats + build tree size
        # Kartend-bkidv: track the instrumented tree's size — it is what puts
        # this job near the disk ceiling on a 72 GB runner.
        run: |
          ccache --show-stats
          du -sh build/TSan
          df -h /

      - name: Run Tests (TSan)
        env:
          QT_QPA_PLATFORM: offscreen
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/tests/suppressions/tsan.txt
        run: |
          cd build/TSan
          ctest --output-on-failure -LE benchmark

      - name: Upload test logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-tsan-logs-${{ github.run_id }}
          path: |
            build/TSan/Testing/Temporary/LastTest.log
            build/TSan/Testing/Temporary/LastTestsFailed.log
          retention-days: 30

      - name: Harvest failure evidence for the tracking issue
        # Distill the ctest logs into a bounded markdown block the issue can
        # carry inline. The run log and the artifact above are both tied to
        # the run's lifetime; the tracking issue is the only place evidence
        # survives a deleted run (GH#77) or the 30-day artifact expiry.
        if: ${{ failure() && github.event_name == 'schedule' }}
        run: |
          LOG=build/TSan/Testing/Temporary/LastTest.log
          FAILED=build/TSan/Testing/Temporary/LastTestsFailed.log
          EVIDENCE="$RUNNER_TEMP/tsan-evidence.md"
          {
            if [ -f "$FAILED" ]; then
              echo '**Failed tests**'
              echo '```'
              cat "$FAILED"
              echo '```'
            else
              echo '_No LastTestsFailed.log — the failure preceded ctest (configure or build); see the workflow log._'
            fi
            if [ -f "$LOG" ]; then
              # First report only: halt_on_error=1 aborts each test binary at
              # its FIRST unsuppressed report, so later blocks in the log are
              # separate binaries echoing the same root cause — triage is
              # one-report-per-night regardless.
              first_tsan=$(awk '/WARNING: ThreadSanitizer/{f=1} f{print; if (/SUMMARY: ThreadSanitizer/) exit}' "$LOG" | head -c 20000)
              if [ -n "$first_tsan" ]; then
                printf '\n**First ThreadSanitizer report**\n```\n%s\n```\n' "$first_tsan"
              fi
              if [ -f "$FAILED" ]; then
                # Tail of each failed test's LastTest.log section: a plain
                # assertion failure (no TSan report) prints its QVERIFY
                # detail at the end of the test's output.
                while IFS=: read -r _idx name; do
                  [ -n "$name" ] || continue
                  section=$(awk -v n="$name" '
                    started && $0 ~ /^[0-9]+\/[0-9]+ Testing: / { exit }
                    $0 ~ ("^[0-9]+/[0-9]+ Testing: " n "$") { started = 1 }
                    started { print }' "$LOG" | tail -c 8000)
                  if [ -n "$section" ]; then
                    printf '\n**%s — tail of its LastTest.log section**\n```\n%s\n```\n' "$name" "$section"
                  fi
                done < "$FAILED"
              fi
            fi
          } > "$EVIDENCE"
          # GitHub issue bodies/comments cap at 65536 chars; leave headroom
          # for the fixed body text around the evidence block.
          if [ "$(wc -c < "$EVIDENCE")" -gt 60000 ]; then
            head -c 60000 "$EVIDENCE" > "$EVIDENCE.tmp"
            printf '\n```\n\n_… truncated to fit the GitHub comment limit; full logs are in the run artifact (30 days) while the run exists._\n' >> "$EVIDENCE.tmp"
            mv "$EVIDENCE.tmp" "$EVIDENCE"
          fi
          echo "TSAN_EVIDENCE_FILE=$EVIDENCE" >> "$GITHUB_ENV"

      - name: File or update tracking issue on failure
        # On failure, file/update a single rolling 'Nightly TSan failing'
        # issue. Subsequent failures append a comment with the failing run
        # URL so the issue collects history without flooding the tracker.
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const title = 'Nightly TSan failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            let evidence = '';
            try {
              evidence = fs.readFileSync(process.env.TSAN_EVIDENCE_FILE, 'utf8').trim();
            } catch {
              // Harvest step failed or never ran — file the issue without it.
            }
            const evidenceBlock = evidence
              ? `\n\n<details>\n<summary>Failure evidence (embedded — survives run/artifact deletion)</summary>\n\n${evidence}\n\n</details>`
              : '';
            const body = `Nightly TSan job failed.\n\nRun: ${runUrl}\nSHA: ${context.sha}${evidenceBlock}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tsan-nightly',
              per_page: 100,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${body}\n\nThis issue tracks recurring nightly TSan failures. It will receive a comment for each subsequent failed run; close it once the underlying race is fixed.`,
                labels: ['tsan-nightly'],
              });
            }

  # Kartend-w9s8e: the only place in CI where `ctest -L benchmark` actually
  # executes. gcc Release (matching the build users run), no sanitizer, and
  # only the bench_* executables are built — the full test tree would triple
  # the job for no benefit. Results land in the step summary; the raw ctest
  # log is uploaded as an artifact so a regression hunt can diff exact
  # iteration counts across nights.
  benchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: g++ cmake ninja-build ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev qt6-image-formats-plugins libqt6sql6-sqlite libzstd-dev libarchive-dev qtkeychain-qt6-dev pulseaudio

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          # Cache-key policy, and the accepted staleness that comes with
          # it, are documented once at the ccache step in build.yml
          # (Kartend-pcc65). Do not chase the hit rate here without
          # reading that first.
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-bench-${{ hashFiles('CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-ccache-bench-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=2G
          # PCH-using compiles need this to be cacheable (Kartend-zhodi)
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      - name: Configure CMake (Release)
        run: |
          mkdir -p build/bench
          cd build/bench
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DKARTEND_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build benchmark targets
        # Derive the target list from the add_executable(bench_*) entries under
        # tests/ — tests/CMakeLists.txt plus the tests/cmake/*.cmake fragments it
        # include()s (Kartend-n1hpy.8 split the monolith) — so a newly-added
        # benchmark is picked up here without anyone remembering to edit this
        # workflow, regardless of which fragment defines it.
        run: |
          BENCH_TARGETS=$(grep -rhoP 'add_executable\(\Kbench_\w+' \
            --include='*.cmake' --include='CMakeLists.txt' tests/ | sort -u)
          echo "Benchmark targets: $BENCH_TARGETS"
          test -n "$BENCH_TARGETS"
          cd build/bench
          cmake --build . --parallel "$(nproc)" --target $BENCH_TARGETS

      - name: ccache stats
        run: ccache --show-stats

      - name: Run benchmarks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build/bench
          ctest -L benchmark --output-on-failure

      # Rolling baseline for night-over-night diffing (below). The primary key
      # is unique per run so every night SAVES a fresh table; restore-keys'
      # prefix match then restores the most recent previous night. Keyed
      # per-branch so a manual workflow_dispatch from a topic branch doesn't
      # poison main's baseline (restore still falls through to any branch's
      # table rather than starting blind).
      - name: Restore previous benchmark baseline
        uses: actions/cache/restore@v6
        with:
          path: bench-baseline
          key: ${{ runner.os }}-bench-baseline-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-bench-baseline-${{ github.ref_name }}-
            ${{ runner.os }}-bench-baseline-

      - name: Compare against previous baseline
        # Day-over-day regression visibility (the summary table below shows
        # absolutes, but nothing compared runs). Parse the QBENCHMARK RESULT
        # pairs into "<suite::slot> <value> <unit>" rows, diff against the
        # restored table, and WARN on slots that got >2.0x slower — a
        # deliberately generous threshold because shared-runner wallclock is
        # too noisy to gate on. Warn-only by construction: every path exits 0
        # and only writes summary/annotation text.
        run: |
          LOG=build/bench/Testing/Temporary/LastTest.log
          mkdir -p bench-current bench-baseline
          if [ -f "$LOG" ]; then
            awk '/^RESULT/ { name=$3; if (getline > 0) print name, $1, $2 }' "$LOG" \
              > bench-current/results.txt
          else
            : > bench-current/results.txt
          fi
          {
            echo "## Benchmark baseline comparison"
            echo
            if [ ! -s bench-baseline/results.txt ]; then
              echo "_No previous baseline in the cache — this run seeds it; comparisons start next night._"
            elif [ ! -s bench-current/results.txt ]; then
              echo "_No RESULT lines in this run's log — baseline kept from the previous run._"
            else
              # Join on slot name; ratio in awk (shell has no float math).
              # Unit mismatches (msecs vs instructions after a harness change)
              # are skipped rather than mis-scaled.
              awk 'NR==FNR { prev[$1]=$2; unit[$1]=$3; next }
                   {
                     if (!($1 in prev)) { printf "- `%s`: new slot (no baseline)\n", $1; next }
                     if (unit[$1] != $3) { printf "- `%s`: unit changed %s -> %s, skipped\n", $1, unit[$1], $3; next }
                     if (prev[$1] + 0 == 0) next
                     ratio = ($2 + 0) / (prev[$1] + 0)
                     if (ratio > 2.0) {
                       printf "- :warning: `%s` is %.2fx slower than the previous run (%s -> %s %s)\n", $1, ratio, prev[$1], $2, $3
                       printf "::warning title=Benchmark regression::%s is %.2fx slower than the previous nightly (%s -> %s %s)\n", $1, ratio, prev[$1], $2, $3 > "/dev/stderr"
                       flagged = 1
                     }
                   }
                   END { if (!flagged) print "No slot regressed past the 2.0x threshold against the previous run." }' \
                bench-baseline/results.txt bench-current/results.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          # Current table becomes the next run's baseline (only when this run
          # actually produced one — an empty table must not wipe the baseline).
          if [ -s bench-current/results.txt ]; then
            cp bench-current/results.txt bench-baseline/results.txt
          fi

      - name: Save benchmark baseline for the next run
        uses: actions/cache/save@v6
        with:
          path: bench-baseline
          key: ${{ runner.os }}-bench-baseline-${{ github.ref_name }}-${{ github.run_id }}

      - name: Publish results to step summary
        # QBENCHMARK emits two-line "RESULT : <suite::slot>:" + walltime
        # pairs; ctest stores every test's stdout in LastTest.log regardless
        # of pass/fail verbosity settings, so harvest from there.
        if: ${{ always() }}
        run: |
          LOG=build/bench/Testing/Temporary/LastTest.log
          {
            echo "## Nightly benchmark results"
            echo
            echo "Wallclock on a shared runner — compare the trend across runs, not absolutes."
            echo
            echo '```'
            if [ -f "$LOG" ]; then
              grep -A1 '^RESULT' "$LOG" || echo "No RESULT lines found in $LOG"
            else
              echo "Missing $LOG — did the ctest step run?"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw benchmark log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-benchmark-log-${{ github.run_id }}
          path: build/bench/Testing/Temporary/LastTest.log
          retention-days: 90
