name: Nightly TSan

# Runs the ThreadSanitizer build + full ctest suite once per day on main, in
# addition to the per-PR TSan job in build.yml. Catches data races that only
# manifest under sustained or cold-cache timing — the per-PR run uses cached
# ccache state and runs the same tests, so a race triggered only by a fresh
# environment (or by tests interacting across many runs) may slip past it.
#
# A failure here opens a GitHub Issue tagged `tsan-nightly` so it stays
# visible even when nobody is watching the Actions tab.
#
# Also hosts the nightly benchmark job (Kartend-w9s8e): every other ctest
# invocation across the workflows passes `-LE benchmark`, so the QBENCHMARK
# suites compiled all along never executed in CI. The benchmarks job runs
# them once per night on a plain gcc Release build (NOT under TSan — the
# instrumentation overhead would swamp the numbers) and archives the
# per-slot results to the run's step summary for trend visibility. No hard
# thresholds: shared-runner wallclock is too noisy to gate on; the value is
# the visible day-over-day series.

on:
  schedule:
    # 03:17 UTC daily. Avoids the on-the-hour congestion windows that crowd
    # GitHub-hosted runner queues.
    - cron: '17 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: nightly-tsan
  cancel-in-progress: false

jobs:
  thread-sanitizer:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: clang cmake ninja-build lld ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite libzstd-dev libarchive-dev qtkeychain-qt6-dev pulseaudio

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Cache ccache
        # Restore-keys deliberately includes the per-PR tsan key so the cold
        # cache scenario isn't entirely cold — we still benefit from
        # incremental compile of unchanged TUs. The primary key is
        # content-addressed (not github.run_id): nightlies are already
        # serialized by `concurrency`, so a unique-per-run key only forced a
        # fresh cache write each night and evicted PR caches (mirrors build.yml).
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-tsan-nightly-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '.github/workflows/nightly-tsan.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-tsan-nightly-
            ${{ runner.os }}-ccache-tsan-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=2G
          # PCH-using compiles need this to be cacheable (Kartend-zhodi)
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      - name: Configure CMake (Debug + TSan)
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p build/TSan
          cd build/TSan
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_ENABLE_TSAN=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build/TSan
          cmake --build . --parallel $(nproc)

      - name: ccache stats
        run: ccache --show-stats

      - name: Run Tests (TSan)
        env:
          QT_QPA_PLATFORM: offscreen
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/tests/suppressions/tsan.txt
        run: |
          cd build/TSan
          ctest --output-on-failure -LE benchmark

      - name: Upload test logs on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-tsan-logs-${{ github.run_id }}
          path: |
            build/TSan/Testing/Temporary/LastTest.log
            build/TSan/Testing/Temporary/LastTestsFailed.log
          retention-days: 30

      - name: File or update tracking issue on failure
        # On failure, file/update a single rolling 'Nightly TSan failing'
        # issue. Subsequent failures append a comment with the failing run
        # URL so the issue collects history without flooding the tracker.
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: actions/github-script@v9
        with:
          script: |
            const title = 'Nightly TSan failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = `Nightly TSan job failed.\n\nRun: ${runUrl}\nSHA: ${context.sha}`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'tsan-nightly',
              per_page: 100,
            });
            const existing = issues.find(i => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: `${body}\n\nThis issue tracks recurring nightly TSan failures. It will receive a comment for each subsequent failed run; close it once the underlying race is fixed.`,
                labels: ['tsan-nightly'],
              });
            }

  # Kartend-w9s8e: the only place in CI where `ctest -L benchmark` actually
  # executes. gcc Release (matching the build users run), no sanitizer, and
  # only the bench_* executables are built — the full test tree would triple
  # the job for no benefit. Results land in the step summary; the raw ctest
  # log is uploaded as an artifact so a regression hunt can diff exact
  # iteration counts across nights.
  benchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: g++ cmake ninja-build ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite libzstd-dev libarchive-dev qtkeychain-qt6-dev pulseaudio

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-bench-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '.github/workflows/nightly-tsan.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-bench-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=2G
          # PCH-using compiles need this to be cacheable (Kartend-zhodi)
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      - name: Configure CMake (Release)
        run: |
          mkdir -p build/bench
          cd build/bench
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DKARTEND_BUILD_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build benchmark targets
        # Derive the target list from the add_executable(bench_*) entries under
        # tests/ — tests/CMakeLists.txt plus the tests/cmake/*.cmake fragments it
        # include()s (Kartend-n1hpy.8 split the monolith) — so a newly-added
        # benchmark is picked up here without anyone remembering to edit this
        # workflow, regardless of which fragment defines it.
        run: |
          BENCH_TARGETS=$(grep -rhoP 'add_executable\(\Kbench_\w+' \
            --include='*.cmake' --include='CMakeLists.txt' tests/ | sort -u)
          echo "Benchmark targets: $BENCH_TARGETS"
          test -n "$BENCH_TARGETS"
          cd build/bench
          cmake --build . --parallel "$(nproc)" --target $BENCH_TARGETS

      - name: ccache stats
        run: ccache --show-stats

      - name: Run benchmarks
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build/bench
          ctest -L benchmark --output-on-failure

      - name: Publish results to step summary
        # QBENCHMARK emits two-line "RESULT : <suite::slot>:" + walltime
        # pairs; ctest stores every test's stdout in LastTest.log regardless
        # of pass/fail verbosity settings, so harvest from there.
        if: ${{ always() }}
        run: |
          LOG=build/bench/Testing/Temporary/LastTest.log
          {
            echo "## Nightly benchmark results"
            echo
            echo "Wallclock on a shared runner — compare the trend across runs, not absolutes."
            echo
            echo '```'
            if [ -f "$LOG" ]; then
              grep -A1 '^RESULT' "$LOG" || echo "No RESULT lines found in $LOG"
            else
              echo "Missing $LOG — did the ctest step run?"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw benchmark log
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-benchmark-log-${{ github.run_id }}
          path: build/bench/Testing/Temporary/LastTest.log
          retention-days: 90
