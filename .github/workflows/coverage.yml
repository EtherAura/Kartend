name: Coverage

# Standalone workflow so the badge in readme.md can reflect coverage status
# specifically (GitHub's actions/<workflow>/badge.svg URL has no per-job
# filter). Triggers mirror build.yml.

on:
  # paths-ignore (Kartend-q9gmq): coverage can't change from a docs-only diff;
  # skip it for pure markdown/doc changes (GitHub runs anyway if any non-doc
  # file is also touched). `main` has no required checks, so a skipped run
  # can't block a merge.
  push:
    branches: [ main, develop ]
    paths-ignore: [ '**.md', 'docs/**', 'LICENSE', '.gitignore' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**', 'LICENSE', '.gitignore' ]

permissions:
  contents: read

concurrency:
  # Cancel duplicate coverage runs on rapid pushes to feature branches —
  # coverage builds aren't cheap and a superseded SHA's report is
  # immediately stale. Main keeps its runs because the badge endpoint
  # would otherwise flicker between pass states across cancels.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  coverage:
    runs-on: ubuntu-24.04
    # Kartend-oizkj: every other job in the repo carries an explicit timeout;
    # without one a test hung under gcov instrumentation burns the 6h default.
    # Coverage build+test runs slower than plain Debug — pad accordingly.
    timeout-minutes: 45
    env:
      # Coverage floors — job-level so both the enforcing step and the
      # ratchet-nudge step read the same constants.
      #
      # Floors track the observed local-gcov baseline minus a tolerance
      # that absorbs the CI-vs-local gcov measurement drift plus small
      # benign refactors. History:
      # post integration-test-harness 27.2% lines / 39.6% functions;
      # per-manager integration suites -> 2026-05-22 showed 35.79% / 46.87%
      # (floor 35 / 46). The 2026-06-03 module test-gap pass raised it to
      # 38.3% lines / 54.1% functions (lcov 2.3.1, local gcov-15).
      # 2026-06-04: local is still 38.4% / 54.0% (no real regression), but
      # CI's older gcov then read ~38% lines / 47.7% functions — the
      # FUNCTION drift widened to ~6pp (the earlier <=0.8pp assumption no
      # longer holds) because the merged async/lambda/inline-heavy code is
      # attributed very differently by CI's gcov; the function floor was
      # pinned just under that worst-case CI reading (47). Floors still
      # catch gross regressions (deleted suite, disabled job, half a
      # manager going untested), not drift.
      # Kartend-en8mj: tightened to ~1pp under the CI-measured actual so
      # hard-won gains are locked in, while keeping a small non-zero margin
      # so normal CI-vs-local gcov drift / benign refactors don't flap.
      # 2026-07: functions floor ratcheted 47 -> 52 (owner-approved): the
      # old floor left ~7pp of silent-regression slack against the local
      # ~54% reading. Enforcement is fatal only on PUSH (main/develop); on
      # pull_request the floor is report-only (see the enforce step) — CI's
      # gcov attributes functions several points below local (the 2026-06-04
      # ~47.7% reading), so gating every PR on 52% would red-wall PRs on a
      # measurement artifact. A push-leg trip is the measurement-drift signal
      # for the maintainer to resolve deliberately (fix attribution or lower
      # the floor), not a coverage regression.
      # This is a MANUAL RATCHET, not a hard ceiling: when a PR lands that
      # improves coverage, bump these floors to capture the gain (still no
      # automated per-run rewrite — keep it a deliberate edit; the
      # ratchet-nudge step warns when the slack exceeds
      # KARTEND_COVERAGE_RATCHET_SLACK points).
      # Set either MIN var to 0 to disable that metric's enforcement
      # (report-only).
      KARTEND_COVERAGE_MIN_LINES: '37'
      KARTEND_COVERAGE_MIN_FUNCTIONS: '52'
      KARTEND_COVERAGE_RATCHET_SLACK: '3'

    steps:
      - uses: actions/checkout@v7
        with:
          # Kartend-5qmjp: full history so diff-cover can compare a PR's changed
          # lines against the merge base (a shallow clone has no common ancestor).
          fetch-depth: 0

      # Kartend-dbkuy: --coverage instrumentation plus the full test-binary
      # set and its .gcno/.gcda spill is the same disk profile as the
      # sanitizer jobs, and it has the same 72 GB-runner exposure.
      - uses: ./.github/actions/free-disk-space

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          # unzip + p7zip-full (Kartend-pnlot.4): the archive paths of the
          # romhasher/launchmanager tests need real extractors. Without them
          # those tests QSKIP silently and deflate the very numbers the
          # coverage floors below gate on.
          packages: g++ cmake ninja-build ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite libarchive-dev qtkeychain-qt6-dev lcov pulseaudio unzip p7zip-full

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Cache ccache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-coverage-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '.github/workflows/coverage.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-coverage-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=2G
          # PCH-using compiles need this to be cacheable (Kartend-zhodi)
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      - name: Configure CMake (Debug + coverage)
        run: |
          cmake -S . -B build/coverage -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_ENABLE_COVERAGE=ON \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build/coverage --parallel $(nproc)

      - name: ccache stats
        run: ccache --show-stats

      - name: Reset coverage counters
        run: lcov --directory build/coverage --zerocounters

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
          # Kartend-pnlot.4 (extends Kartend-68wbk): the extractors are
          # installed above, so a missing archive tool here is a real
          # regression — QFAIL loudly instead of QSKIPping and silently
          # deflating the measured coverage.
          KARTEND_REQUIRE_ARCHIVE_TOOLS: 1
        run: ctest --test-dir build/coverage --output-on-failure -LE benchmark

      - name: Capture coverage data
        run: |
          lcov --directory build/coverage \
               --capture \
               --output-file build/coverage/coverage.info \
               --ignore-errors mismatch,unused,inconsistent,gcov,negative \
               --no-external \
               --base-directory $GITHUB_WORKSPACE
          lcov --remove build/coverage/coverage.info \
               '*/tests/*' \
               '*/build/*' \
               '/usr/*' \
               '*/qt6/*' \
               --output-file build/coverage/coverage.filtered.info \
               --ignore-errors unused,inconsistent

      - name: Generate coverage summary
        run: |
          lcov --list build/coverage/coverage.filtered.info \
               --ignore-errors inconsistent | tee build/coverage/coverage-summary.txt

      # Kartend-5qmjp: the floor check below is whole-repo only, so a PR adding a
      # large untested file barely moves the percentage and slips through.
      # diff-cover reports coverage of just the lines this PR changed, catching
      # new untested code regardless of repo-wide %.
      # Kartend-oizkj: promoted from report-only to ENFORCING (--fail-under=50)
      # after the observation period — the report machinery proved reliable and
      # the report-only mode let an 800-line untested refactor sail through.
      # Tooling failures (diff-cover unavailable, no merge base) still soft-skip
      # so infra flakes can't block a PR; only a real below-threshold patch
      # coverage fails. Escape hatch for legitimately untestable changes: the
      # `skip-patch-coverage` PR label.
      - name: Patch coverage of changed lines (enforced)
        if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'skip-patch-coverage')
        run: |
          if ! python3 -m pip install --quiet --user diff-cover && ! pip install --quiet diff-cover; then
            echo "::warning::diff-cover could not be installed; skipping patch-coverage gate"
            echo "> ⚠️ **Patch-coverage gate skipped** — diff-cover could not be installed (infra issue, not a coverage failure)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          base="origin/${{ github.base_ref }}"
          if ! git fetch --no-tags origin "${{ github.base_ref }}"; then
            echo "::warning::could not fetch base branch; skipping patch-coverage gate"
            echo "> ⚠️ **Patch-coverage gate skipped** — could not fetch the base branch (infra issue, not a coverage failure)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # diff-cover reads the lcov .info directly (recent versions); compare
          # the working tree against the PR's base branch.
          status=0
          diff-cover build/coverage/coverage.filtered.info \
            --compare-branch "$base" \
            --fail-under 50 \
            --markdown-report build/coverage/patch-coverage.md || status=$?
          if [ -f build/coverage/patch-coverage.md ]; then
            {
              echo "## Patch coverage (changed lines)"
              echo ""
              cat build/coverage/patch-coverage.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$status"

      - name: Surface coverage in step summary + enforce floor
        # Floor constants + rationale live in the job-level env block above.
        run: |
          # lcov --summary prints lines like "  lines.....: 47.3% (1234 of 2611 lines)"
          # Capture the percentage and write a GitHub step summary.
          line_pct="$(lcov --summary build/coverage/coverage.filtered.info \
                          --ignore-errors inconsistent 2>&1 \
                      | awk '/^[[:space:]]+lines/ { gsub("%","",$2); print $2; exit }')"
          fn_pct="$(lcov --summary build/coverage/coverage.filtered.info \
                        --ignore-errors inconsistent 2>&1 \
                    | awk '/^[[:space:]]+functions/ { gsub("%","",$2); print $2; exit }')"
          {
            echo "## Coverage"
            echo ""
            echo "| metric | percent | floor |"
            echo "|---|---|---|"
            echo "| lines | ${line_pct:-?}% | ${KARTEND_COVERAGE_MIN_LINES}% |"
            echo "| functions | ${fn_pct:-?}% | ${KARTEND_COVERAGE_MIN_FUNCTIONS}% |"
          } >> "$GITHUB_STEP_SUMMARY"

          # awk handles the float comparison; bash arithmetic can't.
          below() { awk -v p="$1" -v f="$2" 'BEGIN { print (p+0 < f+0) ? "1" : "0" }'; }

          # Enforcement is fatal only on push (main/develop); on pull_request the
          # floor is report-only. CI's gcov attributes functions several points
          # below a local run (the 2026-06-04 ~47.7% reading vs ~54% local), so
          # gating every PR on the ratcheted 52% floor would red-wall PRs on a
          # measurement artifact rather than a real regression. The push legs
          # still hard-enforce, and the step summary shows the numbers on PRs.
          level="warning"; enforce=0
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then level="error"; enforce=1; fi

          failed=0
          line_floor="${KARTEND_COVERAGE_MIN_LINES:-0}"
          if [ "$line_floor" -gt 0 ] && [ -n "$line_pct" ] && [ "$(below "$line_pct" "$line_floor")" = "1" ]; then
            echo "::${level}::Line coverage $line_pct% is below floor $line_floor%"
            failed=1
          fi
          fn_floor="${KARTEND_COVERAGE_MIN_FUNCTIONS:-0}"
          if [ "$fn_floor" -gt 0 ] && [ -n "$fn_pct" ] && [ "$(below "$fn_pct" "$fn_floor")" = "1" ]; then
            echo "::${level}::Function coverage $fn_pct% is below floor $fn_floor%"
            failed=1
          fi
          if [ "$failed" -ne 0 ] && [ "$enforce" = "0" ]; then
            echo "::notice::Coverage below floor — report-only on ${GITHUB_EVENT_NAME}; enforced on push to main/develop."
          fi
          [ "$failed" -eq 0 ] || [ "$enforce" = "0" ]

      - name: Nudge the coverage floor ratchets (non-fatal)
        # Companion to the manual-ratchet policy above, mirroring the
        # ctx-fanout soft ratchet (.scripts/check-layering.py): lowering a
        # floor is always a deliberate decision, but silent slack — observed
        # coverage sitting far above the floor — lets hard-won gains erode
        # invisibly. When observed coverage (line or function) beats its floor
        # by more than KARTEND_COVERAGE_RATCHET_SLACK points, emit a ::warning
        # asking for a floor bump. Never fails the job, and never rewrites the
        # floor itself — the bump stays a reviewed edit to this file.
        run: |
          line_pct="$(lcov --summary build/coverage/coverage.filtered.info \
                          --ignore-errors inconsistent 2>&1 \
                      | awk '/^[[:space:]]+lines/ { gsub("%","",$2); print $2; exit }')"
          fn_pct="$(lcov --summary build/coverage/coverage.filtered.info \
                        --ignore-errors inconsistent 2>&1 \
                    | awk '/^[[:space:]]+functions/ { gsub("%","",$2); print $2; exit }')"
          line_floor="${KARTEND_COVERAGE_MIN_LINES:-0}"
          fn_floor="${KARTEND_COVERAGE_MIN_FUNCTIONS:-0}"
          slack="${KARTEND_COVERAGE_RATCHET_SLACK:-3}"
          if [ -z "$line_pct" ] || [ "$line_floor" -le 0 ]; then
            echo "Line ratchet nudge skipped (no measured value, or line-floor enforcement disabled)."
          elif [ "$(awk -v p="$line_pct" -v f="$line_floor" -v s="$slack" 'BEGIN { print (p - f > s) ? "1" : "0" }')" = "1" ]; then
            echo "::warning::Line coverage ${line_pct}% exceeds the ${line_floor}% floor by more than ${slack} points — ratchet KARTEND_COVERAGE_MIN_LINES up in coverage.yml to lock in the gain (deliberate edit; lowering is always allowed, silent slack is not)."
          else
            echo "Line coverage ${line_pct}% is within ${slack} points of the ${line_floor}% floor — no ratchet nudge."
          fi
          if [ -z "$fn_pct" ] || [ "$fn_floor" -le 0 ]; then
            echo "Function ratchet nudge skipped (no measured value, or function-floor enforcement disabled)."
          elif [ "$(awk -v p="$fn_pct" -v f="$fn_floor" -v s="$slack" 'BEGIN { print (p - f > s) ? "1" : "0" }')" = "1" ]; then
            echo "::warning::Function coverage ${fn_pct}% exceeds the ${fn_floor}% floor by more than ${slack} points — ratchet KARTEND_COVERAGE_MIN_FUNCTIONS up in coverage.yml to lock in the gain (deliberate edit; lowering is always allowed, silent slack is not)."
          else
            echo "Function coverage ${fn_pct}% is within ${slack} points of the ${fn_floor}% floor — no ratchet nudge."
          fi

      - name: Generate HTML report
        run: |
          genhtml build/coverage/coverage.filtered.info \
                  --output-directory build/coverage/html \
                  --title "Kartend Coverage" \
                  --ignore-errors inconsistent,source

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            build/coverage/coverage.filtered.info
            build/coverage/coverage-summary.txt
            build/coverage/html/
          if-no-files-found: error
          retention-days: 14
