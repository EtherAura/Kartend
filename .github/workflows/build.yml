name: Build and Test

# Runner: the Linux jobs are pinned to ubuntu-24.04 (its apt qt6-base-dev is
# the Qt 6.4.2 minimum-version floor). GitHub Actions does not support sharing
# `runs-on:` across jobs without a reusable workflow or repo-level `vars`, so
# the literal is repeated; when bumping, update all the Linux jobs together.
# Kartend-elluw: coverage spans Qt 6.4.2 (apt) + Qt 6.8 (linux-qt-newer) on
# Linux, Qt 6.7 on Windows (windows-build-test), and Qt 6.8 on macOS
# (macos-build-test) so a version- or platform-specific regression is caught
# before release.

on:
  # paths-ignore (Kartend-q9gmq): a doc/markdown-only change can't affect the
  # build, tests, layering, or test-mapping, so skip the full matrix +
  # ~52-min maintenance job for it. GitHub only skips the workflow when EVERY
  # changed file matches, so a mixed docs+code PR still runs.
  # Kartend-gy0o4: `script-lint` and `build (Release, gcc)` are REQUIRED
  # checks on main now — doc-only PRs get same-named instant-green checks
  # from required-checks-noop.yml (keep its paths list in lockstep with the
  # paths-ignore lists below).
  push:
    branches: [ main, develop ]
    paths-ignore: [ '**.md', 'docs/**', 'LICENSE', '.gitignore' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**', 'LICENSE', '.gitignore' ]
  # Manual trigger (Kartend-e0crh): lets us re-run the full matrix on demand and
  # re-register the workflow with GitHub if a push ever fails to schedule it —
  # which happened silently after build.yml was last edited, while the other
  # workflows kept running. `gh workflow run "Build and Test" --ref main`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel duplicate runs on rapid pushes to feature branches — the
  # sanitizer matrix is expensive enough that letting superseded SHAs
  # finish is pure waste. Main/release pipelines (refs/heads/main) keep
  # their runs so a force-cancel doesn't blank out the green checkmark
  # CDN consumers (badges, release process) depend on.
  #
  # THAT PROTECTS A RUNNING MAIN BUILD, NOT A QUEUED ONE (Kartend-ur7uo).
  # cancel-in-progress: false makes a new run WAIT rather than cancel, but
  # GitHub allows only ONE PENDING run per concurrency group — a third
  # arrival cancels the one still waiting. Three pushes to main in quick
  # succession on 2026-08-12 did exactly that: the middle commit's Build and
  # Test never ran, while its Coverage, CodeQL and CHANGELOG Enforcer (which
  # share no group) all passed. So an intermediate main commit can carry a
  # green-looking check set with no build behind it, which matters to a
  # bisect or a release audit rather than to the tip.
  #
  # Accepted rather than fixed. Adding the SHA to the group would guarantee a
  # build per commit, at the cost of running the full sanitizer matrix
  # concurrently for every push in a burst — the expense this block exists to
  # avoid. Batching commits into one push avoids it for free; the tip of main
  # is always built either way.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  script-lint:
    runs-on: ubuntu-24.04
    # Fast, build-independent preflight: shellcheck, clang-format, and the
    # python/metadata guardrails. Split out from maintenance-check (~52 min)
    # so a shell typo / one-line formatting drift / layering violation fails
    # in ~30s instead of costing a contributor an hour of CI (Kartend-cifqk).
    # The step sequence lives in the script-lint composite action
    # (.github/actions/script-lint) so branch-lint.yml can run the identical
    # checks on feature-branch pushes without a second drifting copy. This
    # job's NAME stays `script-lint` — it is a REQUIRED check on main
    # (Kartend-gy0o4); a composite keeps the check name intact where a
    # reusable workflow would rename it to `script-lint / <job>`.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/script-lint

  build:
    runs-on: ubuntu-24.04
    # Catch a hung build/test before it burns the 6h default. The slowest
    # matrix cell is ~13 min with cold ccache; 45 matches sanitizers /
    # thread-sanitizer so mirror weather in install-deps converts to a slower
    # green instead of a false red (Kartend-wym32: build-no-zstd burned its
    # whole 30-min budget on a slow-but-alive mirror the Acquire inactivity
    # timeouts cannot catch; install-deps now also bounds the install itself).
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        compiler: [gcc, clang]
        # Kartend-d00xf: the plain Debug×clang cell is dropped — clang Debug
        # is already exercised (with far stricter checking) by the sanitizers
        # and thread-sanitizer jobs below, so the cell only duplicated their
        # compile coverage. Release×clang stays: it is the only optimized
        # clang build in the matrix and feeds the maintenance toolchain match.
        exclude:
          - build_type: Debug
            compiler: clang
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++
          # Kartend-3qpq8: enforce -Werror under GCC too. KARTEND_MAINTENANCE
          # (which adds -Werror -Wall -Wextra -Wshadow) was previously only
          # ever exercised under clang (build.sh --maintenance / the
          # maintenance-check job), so a GCC-only -Wall/-Wextra/-Wshadow
          # diagnostic was never promoted to an error and could land silently.
          # This overlay targets exactly the Release+gcc cell (the cheapest
          # reasonable one — it reuses that cell's existing ccache and adds no
          # new job) by matching both keys; cmake_extra is empty for every
          # other cell. Keep on Release+gcc specifically so it sits alongside
          # the REQUIRED `build (Release, gcc)` check.
          - build_type: Release
            compiler: gcc
            cmake_extra: -DKARTEND_MAINTENANCE=ON
            # libsdl2-dev only on this cell: SDL2 is the primary Linux gamepad
            # backend, and without it no Linux CI cell ever compiles the SDL2
            # path. One cell (the REQUIRED check, which also carries the
            # -Werror maintenance overlay) is enough for compile coverage
            # without paying the install on every cell.
            extra_packages: libsdl2-dev

    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          # ${{ matrix.extra_packages }} is empty for every cell except the
          # Release+gcc overlay above (same mechanism as cmake_extra).
          packages: clang cmake ninja-build lld ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev qt6-image-formats-plugins libqt6sql6-sqlite libzstd-dev libarchive-dev qtkeychain-qt6-dev pulseaudio unzip p7zip-full ${{ matrix.extra_packages }}

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Set up ccache
        # Cache key is content-addressed on the build config files. A
        # source-only change (the common case) reuses the existing cache;
        # a config change rolls a new cache. Avoid github.run_id keys —
        # they force a write on every run and balloon the repo cache size
        # (11 ccache steps x max_size=2G against a 10 GB repo limit).
        #
        # Kartend-kpnv9: the hash deliberately does NOT include this
        # workflow file any more. It used to, so editing an unrelated job —
        # the Windows leg, a comment — rolled a brand new key and cold-built
        # every Linux ccache job. Dropping it is safe because ccache hashes
        # the real compiler command line itself: if a configure flag here
        # does change compilation, those entries simply miss rather than
        # being served wrongly. The workflow file was buying invalidation we
        # already get for free, at the cost of throwing the cache away.
        #
        # ACCEPTED LIMITATION — the cache goes stale and we live with it
        # (Kartend-pcc65, decided 2026-07-25). Read this before "fixing" the
        # hit rate, because the obvious remedies are worse.
        #
        # Source files are not in the hash, so an ordinary source-only
        # change leaves the key UNCHANGED — an exact primary-key hit. And
        # actions/cache does not save on an exact hit. The cache is
        # therefore populated once, when a config change rolls the key, and
        # never written back afterwards. Objects for changed or new sources
        # are never persisted, so the hit rate decays as the tree drifts
        # away from whenever the key last rolled.
        #
        # Measured on the sanitizers job (run 30166939300):
        #   Cache size (GB):  2.0 / 2.0 (99.97%)   <- full, at max_size
        #   Hits:               18 / 1029 (1.75%)
        # i.e. saturated with entries that no longer match anything being
        # compiled, and with no mechanism to flush them.
        #
        # Why we accept it rather than fix it:
        #   * Always-write keys (github.run_id/sha) would refresh the cache
        #     but write ~11 caches per run against a 10 GB per-repo limit;
        #     they would LRU-evict each other and plausibly do worse.
        #   * Shrinking max_size to fit more generations in that budget is
        #     backwards: 2 GB already holds only about ONE build's objects
        #     (1029 cacheable compiles), so smaller means more thrash.
        #   * The failure mode is mild — a cold-ish compile costs minutes on
        #     jobs whose real cost is elsewhere (Kartend-cdklm: the Windows
        #     leg was link-bound, not compile-bound).
        # Revisit only with real per-job cache sizes in hand; the 10 GB
        # budget cannot be divided sensibly without them.
        #
        # Nuance worth knowing if you touch the key: 'CMakeLists.txt' in the
        # hash below matches only the ROOT one — the pattern is not
        # recursive, so src/CMakeLists.txt and tests/CMakeLists.txt do NOT
        # roll it. Kartend-wjgjy rewrote tests/CMakeLists.txt without
        # rolling any cache key. Harmless there (it changed link type, not
        # compile lines), but do not assume "all build config" is covered.
        uses: ./.github/actions/setup-ccache
        with:
          key-infix: ccache-${{ matrix.build_type }}-${{ matrix.compiler }}
          extra-restore-infix: ccache-${{ matrix.build_type }}

      - name: Create build directory
        run: mkdir -p build/${{ matrix.build_type }}-${{ matrix.compiler }}

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cd build/${{ matrix.build_type }}-${{ matrix.compiler }}
          # ${{ matrix.cmake_extra }} is empty for every cell except the
          # Release+gcc one, where it carries -DKARTEND_MAINTENANCE=ON
          # (Kartend-3qpq8) so -Werror is enforced under GCC as well as clang.
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_PORTABLE_RELEASE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            ${{ matrix.cmake_extra }}

      - name: Build
        run: |
          cd build/${{ matrix.build_type }}-${{ matrix.compiler }}
          cmake --build . --parallel $(nproc)

      - name: ccache stats
        run: ccache --show-stats

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
          # Kartend-68wbk: tools are installed above (Kartend-03lcs), so a
          # missing archive extractor here is a real regression — fail loudly
          # instead of letting the archive tests silently QSKIP.
          KARTEND_REQUIRE_ARCHIVE_TOOLS: 1
        run: |
          cd build/${{ matrix.build_type }}-${{ matrix.compiler }}
          # Staged ctest parallelism rollout (Kartend-pnlot.1): the harness is
          # engineered for -j (per-test HOME isolation, per-class integration
          # entries, RUN_SERIAL on the one known conflict), but enable it on the
          # primary Release/gcc cell only for now — widen to the remaining jobs
          # (sanitizers LAST; TSan timing shifts under load) once a few runs
          # prove stable.
          if [ "${{ matrix.build_type }}-${{ matrix.compiler }}" = "Release-gcc" ]; then
            export CTEST_PARALLEL_LEVEL="$(nproc)"
          fi
          ctest --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics
        # Kartend-oieo: unified Linux + Windows failure-detail path; see
        # .scripts/print-failed-tests.py for the rationale.
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 .scripts/print-failed-tests.py --build-dir build/${{ matrix.build_type }}-${{ matrix.compiler }}

      - name: Capture SIGILL backtrace under gdb
        # Only for the (Release, gcc/clang) job that we've seen SIGILL on,
        # and only if `Run Tests` failed. Re-runs the integration test
        # binary under gdb -batch to print the faulting backtrace; ctest
        # itself swallows it. Removable once the SIGILL is root-caused.
        if: ${{ failure() && matrix.build_type == 'Release' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y gdb
          BIN="build/${{ matrix.build_type }}-${{ matrix.compiler }}/tests/integration/test_integration"
          # Guard against silent rot (Kartend-i15r4): if the binary path moves,
          # the old `|| true` made this diagnostic a no-op with no signal. Emit a
          # GitHub warning annotation instead so the gap is visible in the log.
          if [ ! -x "$BIN" ]; then
            echo "::warning::SIGILL diagnostic skipped — integration binary not found at $BIN (path moved? update build.yml)"
            exit 0
          fi
          gdb -batch \
            -ex 'set pagination off' \
            -ex 'handle SIGILL stop print pass' \
            -ex 'run' \
            -ex 'thread apply all bt full' \
            -ex 'info registers' \
            -ex 'x/16i $pc-32' \
            --args "$BIN" \
            testFixtureBuildsWithoutTouchingRealConfig || true

  # Build with zstd explicitly disabled. Kart compression falls back to
  # qCompress (zlib), and test_kartreader.cpp's QSKIP("Built without zstd
  # support") path actually runs. Without this job the no-zstd code path
  # is untested and could rot silently.
  build-no-zstd:
    runs-on: ubuntu-24.04
    # 45 rather than 30: this job died on main run 30916204629 after a
    # slow-but-alive apt mirror consumed the entire budget inside
    # install-deps — presented as "cancelled", not "failed". Matches the
    # sanitizers jobs' headroom (Kartend-wym32).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        # Deliberately omit libzstd-dev. KARTEND_ENABLE_ZSTD=OFF below makes
        # the omission explicit even on runners that ship libzstd-dev as a
        # transitive dep of some other package.
        uses: ./.github/actions/install-deps
        with:
          packages: g++ cmake ninja-build ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev qt6-image-formats-plugins libqt6sql6-sqlite qtkeychain-qt6-dev pulseaudio unzip p7zip-full

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache
        with:
          key-infix: ccache-no-zstd

      - name: Configure CMake
        run: |
          mkdir -p build/no-zstd
          cd build/no-zstd
          # LIBARCHIVE=OFF pins what the package list above only implies
          # (libarchive-dev omitted) — without the flag, runner-image drift
          # shipping libarchive as a transitive dep would silently re-enable it.
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_PORTABLE_RELEASE=ON \
            -DKARTEND_ENABLE_ZSTD=OFF \
            -DKARTEND_ENABLE_LIBARCHIVE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build/no-zstd
          cmake --build . --parallel $(nproc)

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
          # Kartend-pnlot.4: unzip/p7zip-full are installed above, so a
          # missing extractor is a real regression — QFAIL instead of a
          # silent QSKIP (same guard as the build job, Kartend-68wbk).
          KARTEND_REQUIRE_ARCHIVE_TOOLS: 1
        run: |
          cd build/no-zstd
          ctest --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 .scripts/print-failed-tests.py --build-dir build/no-zstd

      - name: ccache stats
        run: ccache --show-stats

  # Compile-only -Werror coverage of the no-libarchive fallback (RomHasher's
  # shell-out-to-7z/unzip/bsdtar path). Every other Linux job installs
  # libarchive-dev, so without this leg the KARTEND_HAS_LIBARCHIVE=0 side of
  # the #ifdef gates is never compiled under -Werror and a warning there
  # could land silently. Build only — the fallback's runtime behaviour is
  # already exercised by the extractor-tool tests in the jobs above; this
  # job exists purely so the fallback TUs (src + tests) go through the
  # maintenance warning set.
  build-no-libarchive-maintenance:
    runs-on: ubuntu-24.04
    # 45 rather than 30: same install-deps mirror-weather headroom as the
    # other install-deps jobs (Kartend-wym32).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        # Deliberately omit libarchive-dev. KARTEND_ENABLE_LIBARCHIVE=OFF
        # below makes the omission explicit even on runners that ship
        # libarchive as a transitive dep of some other package. No
        # pulseaudio/unzip/p7zip-full either — this job runs no tests.
        uses: ./.github/actions/install-deps
        with:
          packages: g++ cmake ninja-build ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite libzstd-dev qtkeychain-qt6-dev

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache
        with:
          key-infix: ccache-no-libarchive

      - name: Configure CMake
        run: |
          mkdir -p build/no-libarchive
          cd build/no-libarchive
          # Same Release + PORTABLE_RELEASE + BUILD_TESTS shape as the
          # build-no-zstd sibling (tests are BUILT so their fallback-gated
          # TUs compile under -Werror too — they just never run here), plus
          # KARTEND_MAINTENANCE=ON for the -Werror warning set.
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_PORTABLE_RELEASE=ON \
            -DKARTEND_MAINTENANCE=ON \
            -DKARTEND_ENABLE_LIBARCHIVE=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build/no-libarchive
          cmake --build . --parallel $(nproc)

      - name: ccache stats
        run: ccache --show-stats

  sanitizers:
    runs-on: ubuntu-24.04
    # Kartend-cqnsi: normal runtime ~11 min, but a single stalled apt mirror
    # once consumed ~29 min before the build even started. The apt retry/timeout
    # hardening in install-deps should prevent that, but match thread-sanitizer's
    # 45 min so a future mirror hiccup has headroom instead of a false red.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # The instrumented (ASan/UBSan) build plus the full test-binary set
      # outgrew the runner's root disk ("No space left on device" at link).
      # Kartend-dbkuy widened this from an inline rm -rf to the shared action
      # after a 72 GB runner still ran dry with the old, narrower reclaim.
      - uses: ./.github/actions/free-disk-space

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          # libzstd-dev keeps this job on the same optional-backend set as the
          # build matrix — only build-no-zstd omits it deliberately.
          packages: clang cmake ninja-build lld ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev qt6-image-formats-plugins libqt6sql6-sqlite libzstd-dev libarchive-dev qtkeychain-qt6-dev pulseaudio unzip p7zip-full

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache
        with:
          key-infix: ccache-sanitize

      - name: Create build directory
        run: mkdir -p build/Sanitize

      - name: Configure CMake (Debug + sanitizers)
        run: |
          cd build/Sanitize
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_ENABLE_SANITIZERS=ON \
            -DKARTEND_SLIM_DEBUG_INFO=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build/Sanitize
          cmake --build . --parallel $(nproc)

      - name: ccache stats + build tree size
        # Kartend-bkidv: the instrumented tree is what puts this job near the
        # disk ceiling on a 72 GB runner, so record its size every run. A
        # steadily climbing number here is the early warning that the -g1
        # headroom has been eaten by new test executables.
        run: |
          ccache --show-stats
          du -sh build/Sanitize
          df -h /

      - name: Run Tests (ASan/UBSan)
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/suppressions/lsan.txt
          # Kartend-pnlot.4: unzip/p7zip-full are installed above, so a
          # missing extractor is a real regression — QFAIL instead of a
          # silent QSKIP (same guard as the build job, Kartend-68wbk).
          KARTEND_REQUIRE_ARCHIVE_TOOLS: 1
        run: |
          cd build/Sanitize
          ctest --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics (ASan/UBSan)
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/suppressions/lsan.txt
        run: python3 .scripts/print-failed-tests.py --build-dir build/Sanitize

      - name: Smoke-test kartend binary (ASan/UBSan, full teardown)
        env:
          QT_QPA_PLATFORM: offscreen
          KARTEND_SMOKE_TEST_EXIT_MS: "2000"
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:exitcode=42
          UBSAN_OPTIONS: halt_on_error=1:exitcode=42
        run: |
          # Launches the actual app under sanitizers and exits via graceful
          # quit (no quick_exit) so destruction order is fully exercised.
          # Uses a clean throwaway HOME so no real user config is touched.
          export HOME="$RUNNER_TEMP/kartend-smoke-home"
          mkdir -p "$HOME"
          cd build/Sanitize
          ./kartend

  # TSan job — separate from ASan/UBSan because their runtime libraries
  # conflict. Targets the concurrent surfaces (DatabaseManager+QueryManager
  # worker thread, ArtworkManager QtConcurrent batches, CacheManager I/O
  # thread pool). Uses Clang since its TSan is generally more reliable than
  # GCC's on Qt-heavy code.
  thread-sanitizer:
    runs-on: ubuntu-24.04
    # TSan is slower and more variable than the plain build; ~15 min observed,
    # 45 leaves wide headroom while still well under the 6h default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      # Same instrumented-build disk profile as the ASan job above
      # (Kartend-dbkuy) — TSan binaries are just as large.
      - uses: ./.github/actions/free-disk-space

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: clang cmake ninja-build lld ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev qt6-image-formats-plugins libqt6sql6-sqlite libzstd-dev libarchive-dev qtkeychain-qt6-dev pulseaudio unzip p7zip-full

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache
        with:
          key-infix: ccache-tsan

      # NOTE: deliberately no -DKARTEND_SLIM_DEBUG_INFO=ON here, unlike the
      # ASan job. -g1 breaks this job's suppressions — see the
      # KARTEND_SLIM_DEBUG_INFO block in CMakeLists.txt. The TSan tree is only
      # ~3.5 GB anyway (vs ~28 GB for ASan), so it was never disk-constrained
      # and has nothing to gain from the trade.
      - name: Configure CMake (Debug + TSan)
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p build/TSan
          cd build/TSan
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_ENABLE_TSAN=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build/TSan
          cmake --build . --parallel $(nproc)

      - name: ccache stats + build tree size
        # Kartend-bkidv — see the ASan job above for why this is tracked.
        run: |
          ccache --show-stats
          du -sh build/TSan
          df -h /

      - name: Run Tests (TSan)
        env:
          QT_QPA_PLATFORM: offscreen
          # halt_on_error=1 means the first data race fails the build.
          # second_deadlock_stack=1 prints the full stack of both threads
          # involved in a lock-order inversion, which is how Qt event loop
          # deadlocks usually surface.
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/tests/suppressions/tsan.txt
          # Kartend-pnlot.4: unzip/p7zip-full are installed above, so a
          # missing extractor is a real regression — QFAIL instead of a
          # silent QSKIP (same guard as the build job, Kartend-68wbk).
          KARTEND_REQUIRE_ARCHIVE_TOOLS: 1
        run: |
          cd build/TSan
          ctest --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics (TSan)
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/tests/suppressions/tsan.txt
        run: python3 .scripts/print-failed-tests.py --build-dir build/TSan

  maintenance-check:
    runs-on: ubuntu-24.04
    # Maintenance build (clang, KARTEND_MAINTENANCE=ON -Werror) + scoped
    # static analysis. What runs on top of the build depends on the event:
    # Kartend-z4ev0: on pull_request the clang-tidy pass is diff-scoped to the
    # changed .cpp TUs (see the "Compute clang-tidy diff scope" step), so PR
    # runs are dominated by the build, not the analysis. On push / dispatch
    # the advisory analysis trio is skipped entirely (--analysis=off) and the
    # ENFORCING curated-check clang-tidy gate below runs instead; the full
    # advisory sweep (all check families + IWYU + cppcheck, formerly >2
    # CPU-hours on every push to main) now lives in nightly-lint.yml. The
    # timeout keeps full-sweep-era headroom: the curated gate still runs the
    # clang-analyzer machinery over every src/ TU. Tighten once a few
    # post-demotion push runs establish the new baseline.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the diff-scope step below can resolve the merge
          # base against the PR's target branch (origin/$GITHUB_BASE_REF...HEAD).
          fetch-depth: 0

      # Kartend-bkidv: deliberately NO free-disk-space step here. It looked
      # like cheap insurance when Kartend-dbkuy added it, but the first main
      # run measured the reclaim at 1m51s, and this job has never once failed
      # on disk — it is a single uninstrumented build, nothing like the ~40 GB
      # sanitizer trees. Report the numbers instead (see the ccache stats step
      # below); re-add the reclaim if the data says this job is actually tight.

      - name: Compute clang-tidy diff scope (PRs only)
        # Kartend-z4ev0: restrict the PR clang-tidy pass to the .cpp TUs the
        # PR actually changed (vs the merge base). The list is consumed by
        # .scripts/build.sh via KARTEND_TIDY_ONLY_FILES; push/dispatch runs
        # skip this step and run the curated fatal gate below instead.
        # KNOWN LIMITATION (kept simple on purpose): a changed header does
        # NOT pull its including TUs into the scope — header-only regressions
        # are caught by the nightly full sweep (nightly-lint.yml) after
        # merge. An empty list (e.g. a docs-only PR reaching this job)
        # short-circuits cleanly inside do_clang_tidy. cppcheck and IWYU no
        # longer run here at all — per-file scoping was never a trivial
        # drop-in for either (cppcheck runs off the compdb project view and
        # IWYU off iwyu_tool), so they moved wholesale to the nightly sweep
        # (--analysis=tidy below).
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${GITHUB_BASE_REF}"
          git diff --name-only --diff-filter=d \
            "origin/${GITHUB_BASE_REF}...HEAD" -- '*.cpp' \
            > "$RUNNER_TEMP/tidy-changed-tus.txt"
          echo "KARTEND_TIDY_ONLY_FILES=$RUNNER_TEMP/tidy-changed-tus.txt" >> "$GITHUB_ENV"
          echo "Changed .cpp TUs vs origin/${GITHUB_BASE_REF}:"
          cat "$RUNNER_TEMP/tidy-changed-tus.txt"
          echo "($(wc -l < "$RUNNER_TEMP/tidy-changed-tus.txt") TU(s) in scope)"

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          # libzstd-dev keeps this job on the same optional-backend set as the
          # build matrix, so the analysis passes see the zstd-enabled TUs.
          packages: clang cmake ninja-build lld ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite libzstd-dev libarchive-dev qtkeychain-qt6-dev clang-tidy clang-format-19 cppcheck iwyu jq

      - name: Pin clang-format to v19
        # Ubuntu 24.04's default `clang-format` is v18, which formats slightly
        # differently from v19/v21 used locally. Symlinking makes `clang-format`
        # resolve to v19 in PATH so .scripts/build.sh's --format-check matches
        # what developers produce locally.
        # Kartend-gv2xq: the pinned major version is owned by
        # .scripts/lib/clang-format-version.sh; assert this hardcoded "19"
        # still matches it before symlinking so a bump there can't silently
        # leave CI pinning a stale version.
        run: |
          PINNED="$(. .scripts/lib/clang-format-version.sh && echo "$KARTEND_CLANG_FORMAT_VERSION")"
          if [ "$PINNED" != "19" ]; then
            echo "::error::clang-format pin is $PINNED in .scripts/lib/clang-format-version.sh but this job symlinks clang-format-19. Update this workflow + Dockerfile.ci + ci-local.sh."
            exit 1
          fi
          sudo ln -sf /usr/bin/clang-format-19 /usr/local/bin/clang-format

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache
        with:
          key-infix: ccache-maintenance

      # The build-independent guardrails (layering, singleshot comments,
      # test mapping, bd-id leakage, AppStream/desktop validation) and the
      # clang-format check moved to the fast script-lint job
      # (Kartend-cifqk) — failing them behind this job's ~52-minute clang
      # build cost an hour per trivially-broken PR.

      - name: Run maintenance build script
        # --tests (Kartend-rni3g): configure with KARTEND_BUILD_TESTS=ON so
        # compile_commands.json includes the ~430 test TUs and the analysis
        # passes can see the hand-maintained test tree (it was a complete
        # static-analysis blind spot). --format-check moved to script-lint
        # (Kartend-cifqk).
        # Analysis scoping: pull_request runs keep the diff-scoped advisory
        # clang-tidy pass (--analysis=tidy + KARTEND_TIDY_ONLY_FILES above);
        # push / dispatch runs skip the advisory trio (--analysis=off) — the
        # enforcing curated-check gate in the next step replaces it, and the
        # full advisory sweep (clang-tidy all-families + IWYU + cppcheck)
        # runs nightly in nightly-lint.yml instead of on every push to main.
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            bash .scripts/build.sh --maintenance --tests --analysis=tidy
          else
            bash .scripts/build.sh --maintenance --tests --analysis=off
          fi

      - name: Enforce curated clang-tidy checks (fatal, non-PR runs)
        # ENFORCING clang-tidy gate for pushes to main/develop and manual
        # dispatch: any finding from a check listed in
        # KARTEND_TIDY_FATAL_CHECKS fails the job (--warnings-as-errors).
        # The list mirrors .clang-tidy's WarningsAsErrors set — every entry
        # was verified zero-hit on the tree when promoted there — so a green
        # run is EXPECTED; the FIRST run of this gate must still be watched,
        # and if it fires on pre-existing findings either fix them or trim
        # the env var below (it is the single knob for the fatal set).
        # concurrency-* is deliberately absent: .clang-tidy never enabled
        # that family, so there is no zero-hit evidence — add it here only
        # after a clean observation in the nightly sweep.
        # clang-analyzer-* stays enabled wholesale (advisory) rather than
        # curated-only: the analyzer's checkers share path-sensitive
        # machinery, and running the promoted subset under the same
        # enablement as the .clang-tidy baseline keeps findings comparable
        # with the runs that established "zero hits". Non-analyzer families
        # run curated-only, which is what makes this pass cheaper than the
        # demoted full sweep. Scope is src/ (matching the sweep the baseline
        # was verified on); tests/ stays advisory-only in the nightly.
        if: github.event_name != 'pull_request'
        env:
          # Single knob: comma-separated clang-tidy checks promoted to fatal.
          # Keep in lockstep with .clang-tidy's WarningsAsErrors when
          # promoting or demoting a check. Whitespace is stripped in the run
          # script, so the folded YAML scalar may wrap freely.
          KARTEND_TIDY_FATAL_CHECKS: >-
            bugprone-unchecked-optional-access, bugprone-integer-division,
            bugprone-assignment-in-if-condition, bugprone-chained-comparison,
            bugprone-dangling-handle, bugprone-fold-init-type,
            bugprone-inaccurate-erase, bugprone-multiple-new-in-one-expression,
            bugprone-shared-ptr-array-mismatch, bugprone-sizeof-container,
            bugprone-sizeof-expression, bugprone-string-constructor,
            bugprone-suspicious-memory-comparison,
            bugprone-suspicious-memset-usage, bugprone-suspicious-semicolon,
            bugprone-swapped-arguments, bugprone-throw-keyword-missing,
            bugprone-undefined-memory-manipulation,
            bugprone-unique-ptr-array-mismatch, bugprone-unused-raii,
            bugprone-use-after-move, bugprone-virtual-near-miss,
            performance-move-const-arg, performance-noexcept-destructor,
            performance-noexcept-move-constructor,
            performance-unnecessary-value-param,
            performance-unnecessary-copy-initialization,
            performance-implicit-conversion-in-loop,
            clang-analyzer-core.NullDereference, clang-analyzer-core.DivideZero,
            clang-analyzer-core.UndefinedBinaryOperatorResult,
            clang-analyzer-core.uninitialized.*,
            clang-analyzer-core.StackAddressEscape,
            clang-analyzer-cplusplus.PlacementNew,
            clang-analyzer-cplusplus.PureVirtualCall,
            clang-analyzer-cplusplus.SelfAssignment,
            clang-analyzer-cplusplus.StringChecker,
            clang-analyzer-deadcode.*, clang-analyzer-security.*,
            clang-analyzer-unix.*
        run: |
          set -o pipefail
          checks="$(printf '%s' "$KARTEND_TIDY_FATAL_CHECKS" | tr -d '[:space:]')"
          compdb_dir="build/ninja-maintenance/cc-sanitized"
          if [ ! -f "$compdb_dir/compile_commands.json" ]; then
            echo "::error::sanitized compile_commands.json missing at $compdb_dir — did the maintenance build change its build dir? Update this step's path."
            exit 1
          fi
          mkdir -p build/ninja-maintenance/logs
          # xargs -n1 -P: same fan-out shape as do_clang_tidy in
          # .scripts/lib/quality.sh; xargs exits non-zero (123) if any TU's
          # clang-tidy invocation reports a promoted error, failing the step.
          find src -name '*.cpp' -print0 | xargs -0 -n1 -P"$(nproc)" clang-tidy \
            -p="$compdb_dir" \
            --checks="-*,clang-analyzer-*,${checks}" \
            --warnings-as-errors="${checks}" \
            --header-filter='.*/src/.*' \
            2>&1 | tee build/ninja-maintenance/logs/clang-tidy-fatal.log

      - name: Surface promoted-error clang-tidy findings
        if: ${{ failure() }}
        # The build script's "[ERROR] clang-tidy check failed" message tells
        # us *that* a promoted-as-error check fired, but not *which*. Echo
        # the error lines from the log file so the failure is debuggable
        # without re-running with --debug-output.
        run: |
          if [ -f build/ninja-maintenance/logs/clang-tidy.log ]; then
            echo "::group::clang-tidy promoted errors"
            grep -E 'error:.*\[(bugprone|clang-analyzer)' build/ninja-maintenance/logs/clang-tidy.log || echo "(no matching error lines)"
            echo "::endgroup::"
          fi
          if [ -f build/ninja-maintenance/logs/clang-tidy-fatal.log ]; then
            echo "::group::curated fatal-gate errors"
            grep -E 'error:.*\[' build/ninja-maintenance/logs/clang-tidy-fatal.log || echo "(no matching error lines)"
            echo "::endgroup::"
          fi
          if [ -f build/ninja-maintenance/logs/clang-format.log ]; then
            echo "::group::clang-format issues"
            tail -100 build/ninja-maintenance/logs/clang-format.log || true
            echo "::endgroup::"
          fi

      - name: ccache stats + build tree size
        # Kartend-bkidv: this job gets no disk reclaim (see the note above the
        # clang-tidy diff-scope step) — these numbers are what would justify
        # adding one.
        run: |
          ccache --show-stats
          du -sh build/ninja-maintenance || true
          df -h /

  # Full Windows MSVC build + test job. Pulls Qt 6.7 LTS via
  # install-qt-action (its official binaries are faster than vcpkg can
  # build Qt from source) and SDL2 + zstd via vcpkg manifest mode
  # (vcpkg.json at repo root). Qt6Keychain comes in via FetchContent
  # in CMakeLists rather than vcpkg — its vcpkg port collides with
  # install-qt-action's Qt6, so the project builds it itself against
  # the already-discovered Qt6 instead. Builds kartend.exe + tests,
  # runs ctest offscreen, stages with windeployqt + co-locates the
  # vcpkg-built runtime DLLs, then uploads a downloadable preview
  # .zip artifact.
  windows-build-test:
    runs-on: windows-latest
    # Warm Release runs are 78-109 min; the Debug leg is 12-43 min. 120 keeps
    # real margin (a green main run once cleared the old 90-min cap by 13s)
    # and still bounds a true hang, since the known hang shapes are bounded
    # well below it (per-test TIMEOUT properties in the ctest phase, re-run
    # timeout + step timeout on the diagnostics step; Kartend-yjw52).
    #
    # Kartend-cdklm profiled where that time actually goes (run 29763522815,
    # Release, 79.7 min "Build kartend + tests" = 96% of the job):
    #
    #   all compiles   11.8 min
    #   all links      62.3 min   over 254 link lines (~15 s each)
    #
    # So this is a LINK-bound job, not a compile-bound one. That kills the
    # obvious theories: sccache hit rate and vcpkg cache health together can
    # only ever reclaim part of ~12 min. The cost is /GL + /LTCG — MSVC
    # whole-program optimisation, Release-only, propagated to every consumer
    # through kartend_utils's INTERFACE_LINK_OPTIONS (see
    # cmake/CompilerFlags.cmake) — being paid once per test executable for
    # ~250 executables that are never shipped. It is also exactly why the
    # LTO-free Debug leg is 3-6x faster.
    #
    # RESOLVED by Kartend-qwxy2: the Release leg no longer builds tests, so
    # those ~250 LTCG links are gone and only kartend.exe is whole-program
    # optimised — which is what release.yml ships anyway, so the pre-tag LTO
    # link check survives intact. Expect the Release leg around ~15 min
    # (compiles plus one app link) rather than 78-109. The Debug leg is
    # unchanged and still runs the full test suite.
    #
    # The 120 stays: it bounds a hang rather than tracking the happy path,
    # and the Debug leg has been observed at 43 min. Revisit once a few runs
    # establish the new Release baseline — but do not tighten it to just
    # above the mean, since that converts a slow runner into a red build.
    timeout-minutes: 120
    # h4j5s: matrix Release + Debug so Q_ASSERT / debug checks run on Windows
    # too, not just the Release pipeline. fail-fast off so one leg's failure
    # doesn't cancel the other; the staging/packaging steps below are gated to
    # Release only.
    # The Debug leg is gated off pull_request events: at ~45 min per leg the
    # two Windows legs set the PR wall-clock critical path, and the Debug
    # leg's Q_ASSERT coverage does not need per-PR cadence. Debug still runs
    # on every push to main/develop and on workflow_dispatch (preserving the
    # manual full-matrix re-run). Release stays per-PR — it is the shipping
    # configuration and feeds the preview artifact. fromJSON because a matrix
    # axis takes an expression, not a YAML conditional. release.yml is
    # deliberately untouched: it shares the windows-build composite action
    # (incl. the vcpkg baseline sync step), not this matrix, and keeps its
    # own cadence.
    strategy:
      fail-fast: false
      matrix:
        build_type: ${{ github.event_name == 'pull_request' && fromJSON('["Release"]') || fromJSON('["Release", "Debug"]') }}

    steps:
      - uses: actions/checkout@v7

      # Kartend-t2w4i: MSVC compiler cache. sccache supports MSVC;
      # mozilla/sccache-action installs the binary and wires the GitHub Actions
      # cache backend (SCCACHE_GHA_ENABLED). Run before the shared build action
      # so its configure/build steps pick up the launcher.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      # Shared Windows build pipeline (Kartend-wa4ia): Qt install, MSVC, vcpkg
      # cache + baseline sync, configure, build, and (Release only) windeployqt
      # staging — same action release.yml's windows-release uses, so the two
      # can't drift. PORTABLE_RELEASE is Release-only (matches the old matrix
      # include); the action defaults it OFF for the Debug leg.
      # Kartend-qwxy2: tests are built on the DEBUG leg only. Kartend-cdklm
      # measured this job at 79.6 min of "Build kartend + tests" against 2.07
      # min of "Run tests" — the Release leg was spending ~80 minutes
      # LTCG-linking ~250 test executables to run two minutes of tests. /GL +
      # /LTCG is Release-only and propagates to every consumer via
      # kartend_utils's INTERFACE_LINK_OPTIONS, so each test exe pays MSVC
      # whole-program optimisation and none of them ship.
      #
      # The pre-tag LTO link check is NOT lost, which was the objection to
      # dropping LTCG outright: kartend.exe is still built Release with
      # /GL + /LTCG on every push here, exactly as release.yml's
      # windows-release builds it (same composite action, build-tests OFF).
      #
      # What IS given up: Release-mode test EXECUTION on Windows. Both axes
      # stay covered separately — the Windows Debug leg runs the full suite,
      # and Linux `build (Release, gcc)` / `(Release, clang)` run it in
      # Release. The residual gap is the intersection: a bug needing MSVC +
      # optimiser + NDEBUG (Q_ASSERT compiled out) together. Narrow, not
      # zero. Re-enable here if that ever bites.
      - name: Build kartend + tests
        uses: ./.github/actions/windows-build
        with:
          build-type: ${{ matrix.build_type }}
          build-tests: ${{ matrix.build_type == 'Debug' && 'ON' || 'OFF' }}
          portable-release: ${{ matrix.build_type == 'Release' && 'ON' || 'OFF' }}
          compiler-launcher: 'sccache'
          stage: ${{ matrix.build_type == 'Release' && 'true' || 'false' }}

      - name: sccache stats
        if: always()
        # Kartend-0uhex: the two legs of this matrix report wildly different
        # cache outcomes from identical request counts — Debug 1035 requests /
        # 483 hits / 85 misses (85%), Release 1035 / 0 hits / 568 misses (0%).
        # Neither reports non-cacheable compilations or cache errors, so
        # sccache is willing to cache the Release objects and simply has
        # nothing to serve.
        #
        # --show-adv-stats adds the per-backend read/write breakdown that
        # plain --show-stats omits, which is what separates the candidate
        # explanations: writes never reaching the GHA backend at all (expect
        # zero cache writes here), versus writes landing under keys nothing
        # ever reads back (expect writes > 0 with hits still 0), versus the
        # entries being evicted between runs (expect writes > 0 and the
        # Release leg's objects simply absent). Cheap, and the alternative is
        # guessing — plain --show-stats has already sustained one wrong
        # conclusion on this job (its "Compile requests 0" was an
        # idle-timeout artifact, Kartend-cdklm).
        run: |
          sccache --show-stats
          echo "::group::sccache adv stats (per-backend breakdown)"
          sccache --show-adv-stats || echo "(--show-adv-stats unsupported by this sccache build)"
          echo "::endgroup::"

      # Kartend-mks5u: VCPKG_APPLOCAL_DEPS is OFF (windows-build action
      # default) — the per-link z-applocal deploys raced each other copying
      # the same DLLs into build\tests and randomly failed links. Instead,
      # test exes resolve their vcpkg DLLs (archive.dll + z/bz2/liblzma
      # chain) from PATH, same as they already resolve Qt DLLs. Debug links
      # against the debug\bin DLLs per the vcpkg triplet layout.
      - name: Put vcpkg runtime DLLs on PATH for ctest
        # Debug only — the Release leg builds no tests (Kartend-qwxy2).
        if: matrix.build_type == 'Debug'
        shell: pwsh
        run: Add-Content $env:GITHUB_PATH "${{ github.workspace }}\build\vcpkg_installed\x64-windows${{ matrix.build_type == 'Debug' && '\debug' || '' }}\bin"

      - name: Run tests
        # QT_QPA_PLATFORM=offscreen mirrors every Linux ctest invocation —
        # the runner has no display server. Output-on-failure so red tests
        # are debuggable from the workflow log without rerunning. The
        # ctest -E exclude regex went from 7 entries down to 0 in three
        # passes; the remaining symlink-shaped tests carry QSKIP-on-
        # Q_OS_WIN gates in-source rather than ctest-level exclusion so
        # the gate stays close to the reason.
        # KARTEND_REQUIRE_ARCHIVE_TOOLS is deliberately NOT set here
        # (Kartend-pnlot.4): the Linux jobs install unzip/p7zip-full
        # themselves, so a missing extractor there is a workflow regression
        # worth a QFAIL. Here extractor availability tracks the
        # windows-latest runner image (7z/tar preinstalled today), which
        # this workflow doesn't control — enforcing would turn an image
        # change into a red wall. QSKIP stays the intended fallback.
        #
        # Debug only — the Release leg builds no tests (Kartend-qwxy2).
        if: matrix.build_type == 'Debug'
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics
        # Kartend-oieo: unified Linux + Windows failure-detail path. The
        # Python helper walks LastTestsFailed.log and re-runs each failed
        # test exe with `-o file,txt` so QTest's per-assertion output
        # bypasses the broken-on-Windows ctest stdout pipe. Identical
        # invocation on both OSes.
        # Kartend-yjw52: a wedged re-run once ate the rest of the job's
        # 90-min budget from inside this step. The script now bounds each
        # re-run (300s) and caps the re-run count (15); the step timeout is
        # the belt-and-braces layer so even a pathological hang shape the
        # script can't see leaves the job budget intact.
        #
        # Debug only — the Release leg has no tests to dump (Kartend-qwxy2).
        if: ${{ failure() && matrix.build_type == 'Debug' }}
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
        run: python .scripts/print-failed-tests.py --build-dir build

      - name: Package preview .zip
        if: matrix.build_type == 'Release'
        # dist\kartend was staged by the shared windows-build action above
        # (stage: true on the Release leg). Compress-Archive is
        # PowerShell-native and avoids pulling in 7z.
        # The artifact name carries the run number so multiple downloads
        # from the same branch are distinguishable.
        run: |
          $zipName = "kartend-windows-x64-preview-r${env:GITHUB_RUN_NUMBER}.zip"
          Compress-Archive -Path dist\kartend\* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload preview artifact
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
          if-no-files-found: error

  # Kartend-elluw: second Linux Qt version. The build / build-no-zstd /
  # sanitizers / tsan jobs above all use Ubuntu 24.04's apt qt6-base-dev
  # (Qt 6.4.2 — the project's minimum floor). This job pulls a newer Qt via
  # install-qt-action so a regression that only shows up on 6.4 *or* only on a
  # modern Qt is caught before release. Qt6Keychain and SDL2 are optional
  # (find_package(... QUIET) in CMakeLists), so the smoke build doesn't need
  # them; credentials fall back to the plaintext-index path and the gamepad
  # backend is simply absent.
  linux-qt-newer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install build tools + Qt runtime libs
        # No apt qt6-* packages here — they would collide with the
        # install-qt-action Qt below. These are the toolchain + the system
        # libraries Qt's official binaries dlopen at runtime (xcb platform
        # plugin, GL, pulse) plus the archive tools the launch/rom tests need.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache libzstd-dev \
            libgl1-mesa-dev libpulse-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            unzip p7zip-full

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Set up ccache
        uses: ./.github/actions/setup-ccache
        with:
          key-infix: ccache-qt68

      - name: Configure CMake
        run: |
          mkdir -p build/qt68
          cd build/qt68
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_PORTABLE_RELEASE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build/qt68
          cmake --build . --parallel $(nproc)

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
          KARTEND_REQUIRE_ARCHIVE_TOOLS: 1
        run: |
          cd build/qt68
          ctest --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 .scripts/print-failed-tests.py --build-dir build/qt68

      - name: ccache stats
        run: ccache --show-stats

  # Kartend-elluw: macOS smoke build. Mirrors the Windows job's
  # install-qt-action → build → offscreen-ctest shape, adapted to Homebrew +
  # clang. zstd comes from brew; Qt6Keychain and SDL2 are optional
  # (find_package QUIET) so they're omitted. This is the first macOS coverage —
  # it surfaces Q_OS_UNIX-vs-Q_OS_MACOS portability gaps (bundle paths, the
  # macOS keychain backend, case-sensitivity) that the Linux/Windows jobs miss.
  macos-build-test:
    runs-on: macos-14
    timeout-minutes: 45
    # h4j5s: also build+test Debug so Q_ASSERT and debug-iterator checks run on
    # macOS, not just the Release pipeline. fail-fast off so a Debug-only failure
    # doesn't cancel the Release leg (or vice versa).
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        include:
          - build_type: Release
            cmake_extra: -DKARTEND_PORTABLE_RELEASE=ON

    steps:
      - uses: actions/checkout@v7

      - name: Install build deps
        run: brew install ninja ccache zstd

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.*'
          host: mac
          target: desktop
          # Universal (arm64 + x86_64) clang build; runs natively on the
          # Apple-Silicon macos-14 runner.
          arch: clang_64
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Set up ccache
        # The macos14 infix bakes the runner image label into the key AND
        # both restore prefixes, so a macOS image bump (e.g. macos-14 →
        # macos-15) starts from a clean ccache rather than reusing objects
        # built against the old SDK. (A runs-on change also rolls the
        # hashFiles() component, but the literal makes the intent explicit.)
        uses: ./.github/actions/setup-ccache
        with:
          key-infix: macos14-ccache-${{ matrix.build_type }}
          cache-path: ~/Library/Caches/ccache
          fallback-infix: macos14-ccache

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DKARTEND_BUILD_TESTS=ON \
            ${{ matrix.cmake_extra }} \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Run tests
        # KARTEND_REQUIRE_ARCHIVE_TOOLS is deliberately NOT set here
        # (Kartend-pnlot.4): the Linux jobs install unzip/p7zip-full
        # themselves, so a missing extractor there is a workflow regression
        # worth a QFAIL. Here extractor availability tracks the macos-14
        # runner image (unzip ships with macOS; 7z only if the image adds
        # it), which this workflow doesn't control — enforcing would turn
        # an image change into a red wall. QSKIP stays the intended
        # fallback.
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 .scripts/print-failed-tests.py --build-dir build

      - name: ccache stats
        run: ccache --show-stats
