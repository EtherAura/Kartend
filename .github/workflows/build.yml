name: Build and Test

# Runner: the Linux jobs are pinned to ubuntu-24.04 (its apt qt6-base-dev is
# the Qt 6.4.2 minimum-version floor). GitHub Actions does not support sharing
# `runs-on:` across jobs without a reusable workflow or repo-level `vars`, so
# the literal is repeated; when bumping, update all the Linux jobs together.
# Kartend-elluw: coverage spans Qt 6.4.2 (apt) + Qt 6.8 (linux-qt-newer) on
# Linux, Qt 6.7 on Windows (windows-build-test), and Qt 6.8 on macOS
# (macos-build-test) so a version- or platform-specific regression is caught
# before release.

on:
  # paths-ignore (Kartend-q9gmq): a doc/markdown-only change can't affect the
  # build, tests, layering, or test-mapping, so skip the full matrix +
  # ~52-min maintenance job for it. GitHub only skips the workflow when EVERY
  # changed file matches, so a mixed docs+code PR still runs.
  # Kartend-gy0o4: `script-lint` and `build (Release, gcc)` are REQUIRED
  # checks on main now — doc-only PRs get same-named instant-green checks
  # from required-checks-noop.yml (keep its paths list in lockstep with the
  # paths-ignore lists below).
  push:
    branches: [ main, develop ]
    paths-ignore: [ '**.md', 'docs/**', 'LICENSE', '.gitignore' ]
  pull_request:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**', 'LICENSE', '.gitignore' ]
  # Manual trigger (Kartend-e0crh): lets us re-run the full matrix on demand and
  # re-register the workflow with GitHub if a push ever fails to schedule it —
  # which happened silently after build.yml was last edited, while the other
  # workflows kept running. `gh workflow run "Build and Test" --ref main`.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Cancel duplicate runs on rapid pushes to feature branches — the
  # sanitizer matrix is expensive enough that letting superseded SHAs
  # finish is pure waste. Main/release pipelines (refs/heads/main) keep
  # their runs so a force-cancel doesn't blank out the green checkmark
  # CDN consumers (badges, release process) depend on.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  script-lint:
    runs-on: ubuntu-24.04
    # Fast, build-independent preflight: shellcheck, clang-format, and the
    # python/metadata guardrails. Split out from maintenance-check (~52 min)
    # so a shell typo / one-line formatting drift / layering violation fails
    # in ~30s instead of costing a contributor an hour of CI (Kartend-cifqk).
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install lint dependencies
        run: sudo apt-get install -y --no-install-recommends shellcheck clang-format-19 appstream desktop-file-utils

      - name: Shellcheck
        # -x follows `source` directives into .scripts/lib/*.sh so build.sh is
        # analysed with its modules inlined (cross-file globals resolve). The
        # lib files are linted directly too; each documents a
        # disable=SC2154,SC2034 because those two checks can't see the
        # build.sh-owned globals when a module is linted in isolation.
        run: |
          shellcheck --version
          shellcheck -x .scripts/*.sh .scripts/lib/*.sh \
            .scripts/git-hooks/pre-commit .scripts/git-hooks/pre-push .scripts/git-hooks/install.sh

      - name: clang-format check (v19 pin)
        # Kartend-cifqk: moved out of maintenance-check — the format check is
        # purely file-based (no compdb), so failing it behind a ~52-minute
        # clang build wasted an hour per drifted PR. Same v19 pin + file walk
        # as .scripts/lib/quality.sh's do_clang_format, but ENFORCING.
        run: |
          clang-format-19 --version
          fail=0
          while IFS= read -r -d '' file; do
            if ! clang-format-19 --style=file --dry-run --Werror "$file" >/dev/null 2>&1; then
              echo "::error file=$file::not formatted with clang-format-19 (run .scripts/build.sh --format-apply)"
              fail=1
            fi
          done < <(find src tests \( -name '*.cpp' -o -name '*.h' \) -print0)
          exit $fail

      - name: Check module layering
        # Build-independent guardrail (moved from maintenance-check,
        # Kartend-cifqk — same below).
        run: python3 .scripts/check-layering.py

      - name: Check QTimer::singleShot 'why' comments
        run: python3 .scripts/check-singleshot-comments.py

      - name: Check src/modules ↔ tests/modules mapping
        run: python3 .scripts/check-test-mapping.py

      - name: Check bd issue ID leakage to user-facing surfaces
        run: python3 .scripts/check-bd-id-leakage.py

      - name: Validate AppStream + desktop metadata
        run: |
          appstreamcli validate --pedantic packaging/*.metainfo.xml
          desktop-file-validate packaging/*.desktop

  build:
    runs-on: ubuntu-24.04
    # Catch a hung build/test before it burns the 6h default. ~30 min covers
    # the slowest matrix cell (~13 min) with cold-ccache + runner headroom.
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
        compiler: [gcc, clang]
        # Kartend-d00xf: the plain Debug×clang cell is dropped — clang Debug
        # is already exercised (with far stricter checking) by the sanitizers
        # and thread-sanitizer jobs below, so the cell only duplicated their
        # compile coverage. Release×clang stays: it is the only optimized
        # clang build in the matrix and feeds the maintenance toolchain match.
        exclude:
          - build_type: Debug
            compiler: clang
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: clang cmake ninja-build lld ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite libzstd-dev qtkeychain-qt6-dev pulseaudio unzip p7zip-full

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          # Cache key is content-addressed on the build config files. A
          # source-only change (the common case) reuses the existing cache;
          # a config change rolls a new cache. Avoid github.run_id keys —
          # they force a write on every run and balloon the repo cache size.
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-${{ matrix.build_type }}-${{ matrix.compiler }}-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ matrix.build_type }}-${{ matrix.compiler }}-
            ${{ runner.os }}-ccache-${{ matrix.build_type }}-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=2G
          # PCH-using compiles need this to be cacheable (Kartend-zhodi)
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      - name: Create build directory
        run: mkdir -p build/${{ matrix.build_type }}-${{ matrix.compiler }}

      - name: Configure CMake
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cd build/${{ matrix.build_type }}-${{ matrix.compiler }}
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_PORTABLE_RELEASE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build/${{ matrix.build_type }}-${{ matrix.compiler }}
          cmake --build . --parallel $(nproc)

      - name: ccache stats
        run: ccache --show-stats

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
          # Kartend-68wbk: tools are installed above (Kartend-03lcs), so a
          # missing archive extractor here is a real regression — fail loudly
          # instead of letting the archive tests silently QSKIP.
          KARTEND_REQUIRE_ARCHIVE_TOOLS: 1
        run: |
          cd build/${{ matrix.build_type }}-${{ matrix.compiler }}
          ctest --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics
        # Kartend-oieo: unified Linux + Windows failure-detail path; see
        # .scripts/print-failed-tests.py for the rationale.
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 .scripts/print-failed-tests.py --build-dir build/${{ matrix.build_type }}-${{ matrix.compiler }}

      - name: Capture SIGILL backtrace under gdb
        # Only for the (Release, gcc/clang) job that we've seen SIGILL on,
        # and only if `Run Tests` failed. Re-runs the integration test
        # binary under gdb -batch to print the faulting backtrace; ctest
        # itself swallows it. Removable once the SIGILL is root-caused.
        if: ${{ failure() && matrix.build_type == 'Release' }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get install -y gdb
          BIN="build/${{ matrix.build_type }}-${{ matrix.compiler }}/tests/integration/test_integration"
          # Guard against silent rot (Kartend-i15r4): if the binary path moves,
          # the old `|| true` made this diagnostic a no-op with no signal. Emit a
          # GitHub warning annotation instead so the gap is visible in the log.
          if [ ! -x "$BIN" ]; then
            echo "::warning::SIGILL diagnostic skipped — integration binary not found at $BIN (path moved? update build.yml)"
            exit 0
          fi
          gdb -batch \
            -ex 'set pagination off' \
            -ex 'handle SIGILL stop print pass' \
            -ex 'run' \
            -ex 'thread apply all bt full' \
            -ex 'info registers' \
            -ex 'x/16i $pc-32' \
            --args "$BIN" \
            testFixtureBuildsWithoutTouchingRealConfig || true

  # Build with zstd explicitly disabled. Kart compression falls back to
  # qCompress (zlib), and test_kartreader.cpp's QSKIP("Built without zstd
  # support") path actually runs. Without this job the no-zstd code path
  # is untested and could rot silently.
  build-no-zstd:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        # Deliberately omit libzstd-dev. KARTEND_ENABLE_ZSTD=OFF below makes
        # the omission explicit even on runners that ship libzstd-dev as a
        # transitive dep of some other package.
        uses: ./.github/actions/install-deps
        with:
          packages: g++ cmake ninja-build ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite qtkeychain-qt6-dev pulseaudio unzip p7zip-full

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-no-zstd-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-no-zstd-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=2G
          # PCH-using compiles need this to be cacheable (Kartend-zhodi)
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      - name: Configure CMake
        run: |
          mkdir -p build/no-zstd
          cd build/no-zstd
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_PORTABLE_RELEASE=ON \
            -DKARTEND_ENABLE_ZSTD=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build/no-zstd
          cmake --build . --parallel $(nproc)

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cd build/no-zstd
          ctest --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 .scripts/print-failed-tests.py --build-dir build/no-zstd

      - name: ccache stats
        run: ccache --show-stats

  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: clang cmake ninja-build lld ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite qtkeychain-qt6-dev pulseaudio unzip p7zip-full

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-sanitize-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-sanitize-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=2G
          # PCH-using compiles need this to be cacheable (Kartend-zhodi)
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      - name: Create build directory
        run: mkdir -p build/Sanitize

      - name: Configure CMake (Debug + sanitizers)
        run: |
          cd build/Sanitize
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_ENABLE_SANITIZERS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build/Sanitize
          cmake --build . --parallel $(nproc)

      - name: ccache stats
        run: ccache --show-stats

      - name: Run Tests (ASan/UBSan)
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/suppressions/lsan.txt
        run: |
          cd build/Sanitize
          ctest --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics (ASan/UBSan)
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1
          LSAN_OPTIONS: suppressions=${{ github.workspace }}/tests/suppressions/lsan.txt
        run: python3 .scripts/print-failed-tests.py --build-dir build/Sanitize

      - name: Smoke-test kartend binary (ASan/UBSan, full teardown)
        env:
          QT_QPA_PLATFORM: offscreen
          KARTEND_SMOKE_TEST_EXIT_MS: "2000"
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:exitcode=42
          UBSAN_OPTIONS: halt_on_error=1:exitcode=42
        run: |
          # Launches the actual app under sanitizers and exits via graceful
          # quit (no quick_exit) so destruction order is fully exercised.
          # Uses a clean throwaway HOME so no real user config is touched.
          export HOME="$RUNNER_TEMP/kartend-smoke-home"
          mkdir -p "$HOME"
          cd build/Sanitize
          ./kartend

  # TSan job — separate from ASan/UBSan because their runtime libraries
  # conflict. Targets the concurrent surfaces (DatabaseManager+QueryManager
  # worker thread, ArtworkManager QtConcurrent batches, CacheManager I/O
  # thread pool). Uses Clang since its TSan is generally more reliable than
  # GCC's on Qt-heavy code.
  thread-sanitizer:
    runs-on: ubuntu-24.04
    # TSan is slower and more variable than the plain build; ~15 min observed,
    # 45 leaves wide headroom while still well under the 6h default.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: clang cmake ninja-build lld ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite libzstd-dev qtkeychain-qt6-dev pulseaudio unzip p7zip-full

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-tsan-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-tsan-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=2G
          # PCH-using compiles need this to be cacheable (Kartend-zhodi)
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      - name: Configure CMake (Debug + TSan)
        env:
          CC: clang
          CXX: clang++
        run: |
          mkdir -p build/TSan
          cd build/TSan
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Debug \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_ENABLE_TSAN=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build/TSan
          cmake --build . --parallel $(nproc)

      - name: ccache stats
        run: ccache --show-stats

      - name: Run Tests (TSan)
        env:
          QT_QPA_PLATFORM: offscreen
          # halt_on_error=1 means the first data race fails the build.
          # second_deadlock_stack=1 prints the full stack of both threads
          # involved in a lock-order inversion, which is how Qt event loop
          # deadlocks usually surface.
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/tests/suppressions/tsan.txt
        run: |
          cd build/TSan
          ctest --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics (TSan)
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1:suppressions=${{ github.workspace }}/tests/suppressions/tsan.txt
        run: python3 .scripts/print-failed-tests.py --build-dir build/TSan

  maintenance-check:
    runs-on: ubuntu-24.04
    # clang-tidy maintenance build is the slowest Linux job (~52 min observed
    # for src/ alone; Kartend-rni3g added the ~430 test TUs, roughly doubling
    # the analyzed set). 150 absorbs the grown run + cold-ccache variance;
    # tighten once a few post-rni3g runs establish the new baseline.
    # Kartend-z4ev0: on pull_request the clang-tidy pass is diff-scoped to the
    # changed .cpp TUs (see the "Compute clang-tidy diff scope" step), so PR
    # runs are dominated by the build, not the analysis; the full ~1430-TU
    # sweep still runs on every push to main. The timeout stays sized for the
    # full-sweep push runs.
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v6
        with:
          # Full history so the diff-scope step below can resolve the merge
          # base against the PR's target branch (origin/$GITHUB_BASE_REF...HEAD).
          fetch-depth: 0

      - name: Compute clang-tidy diff scope (PRs only)
        # Kartend-z4ev0: restrict the PR clang-tidy pass to the .cpp TUs the
        # PR actually changed (vs the merge base). The list is consumed by
        # .scripts/build.sh via KARTEND_TIDY_ONLY_FILES; push-to-main runs
        # skip this step, leave the env unset, and keep the full sweep.
        # KNOWN LIMITATION (kept simple on purpose): a changed header does
        # NOT pull its including TUs into the scope — header-only regressions
        # are caught by the full sweep on main after merge. An empty list
        # (e.g. a docs-only PR reaching this job) short-circuits cleanly
        # inside do_clang_tidy. cppcheck and IWYU intentionally stay
        # full-scope: cppcheck runs off the compdb project view and IWYU off
        # iwyu_tool, so per-file scoping is not a trivial drop-in for either.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin "${GITHUB_BASE_REF}"
          git diff --name-only --diff-filter=d \
            "origin/${GITHUB_BASE_REF}...HEAD" -- '*.cpp' \
            > "$RUNNER_TEMP/tidy-changed-tus.txt"
          echo "KARTEND_TIDY_ONLY_FILES=$RUNNER_TEMP/tidy-changed-tus.txt" >> "$GITHUB_ENV"
          echo "Changed .cpp TUs vs origin/${GITHUB_BASE_REF}:"
          cat "$RUNNER_TEMP/tidy-changed-tus.txt"
          echo "($(wc -l < "$RUNNER_TEMP/tidy-changed-tus.txt") TU(s) in scope)"

      - name: Install dependencies
        uses: ./.github/actions/install-deps
        with:
          packages: clang cmake ninja-build lld ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite qtkeychain-qt6-dev clang-tidy clang-format-19 cppcheck iwyu jq

      - name: Pin clang-format to v19
        # Ubuntu 24.04's default `clang-format` is v18, which formats slightly
        # differently from v19/v21 used locally. Symlinking makes `clang-format`
        # resolve to v19 in PATH so .scripts/build.sh's --format-check matches
        # what developers produce locally.
        run: sudo ln -sf /usr/bin/clang-format-19 /usr/local/bin/clang-format

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-maintenance-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-maintenance-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=2G
          # PCH-using compiles need this to be cacheable (Kartend-zhodi)
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats
          
      # The build-independent guardrails (layering, singleshot comments,
      # test mapping, bd-id leakage, AppStream/desktop validation) and the
      # clang-format check moved to the fast script-lint job
      # (Kartend-cifqk) — failing them behind this job's ~52-minute clang
      # build cost an hour per trivially-broken PR.

      - name: Run maintenance build script
        # --tests (Kartend-rni3g): configure with KARTEND_BUILD_TESTS=ON so
        # compile_commands.json includes the ~430 test TUs and clang-tidy /
        # cppcheck / IWYU analyze the hand-maintained test tree too (it was a
        # complete static-analysis blind spot). Expected cost: the analysis
        # roughly doubles its TU count; the timeout below already
        # accommodates it. --format-check moved to script-lint
        # (Kartend-cifqk).
        run: |
          bash .scripts/build.sh --maintenance --tests

      - name: Surface promoted-error clang-tidy findings
        if: ${{ failure() }}
        # The build script's "[ERROR] clang-tidy check failed" message tells
        # us *that* a promoted-as-error check fired, but not *which*. Echo
        # the error lines from the log file so the failure is debuggable
        # without re-running with --debug-output.
        run: |
          if [ -f build/ninja-maintenance/logs/clang-tidy.log ]; then
            echo "::group::clang-tidy promoted errors"
            grep -E 'error:.*\[(bugprone|clang-analyzer)' build/ninja-maintenance/logs/clang-tidy.log || echo "(no matching error lines)"
            echo "::endgroup::"
          fi
          if [ -f build/ninja-maintenance/logs/clang-format.log ]; then
            echo "::group::clang-format issues"
            tail -100 build/ninja-maintenance/logs/clang-format.log || true
            echo "::endgroup::"
          fi

      - name: ccache stats
        run: ccache --show-stats

  # Full Windows MSVC build + test job. Pulls Qt 6.7 LTS via
  # install-qt-action (its official binaries are faster than vcpkg can
  # build Qt from source) and SDL2 + zstd via vcpkg manifest mode
  # (vcpkg.json at repo root). Qt6Keychain comes in via FetchContent
  # in CMakeLists rather than vcpkg — its vcpkg port collides with
  # install-qt-action's Qt6, so the project builds it itself against
  # the already-discovered Qt6 instead. Builds kartend.exe + tests,
  # runs ctest offscreen, stages with windeployqt + co-locates the
  # vcpkg-built runtime DLLs, then uploads a downloadable preview
  # .zip artifact.
  windows-build-test:
    runs-on: windows-latest
    # ~45 min observed warm; a cold vcpkg cache rebuilds deps from source and
    # runs much longer, so 90 avoids false failures while bounding a true hang.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt 6.7 LTS
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.7.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          # Only aqt-recognized addons go here. qttools / qtsvg /
          # qttranslations ship inside the qtbase tarball by default
          # — listing them as modules makes install-qt-action fail
          # with "packages ... not found while parsing XML". qttest
          # (Qt6::Test) also lives in qtbase.
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      # Kartend-t2w4i: MSVC compiler cache. The Linux legs have had
      # content-addressed ccache from the start; this leg recompiled all
      # ~1000 TUs from scratch every run (~45 min warm). sccache supports
      # MSVC; mozilla/sccache-action installs the binary and wires the
      # GitHub Actions cache backend (SCCACHE_GHA_ENABLED) so no separate
      # actions/cache block is needed for the object cache.
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      # vcpkg is preinstalled on windows-latest at C:\vcpkg. Cache the
      # downloads + per-package binary outputs keyed on the manifest
      # hash so a no-change CI re-run skips the SDL2 + zstd builds.
      - name: Cache vcpkg downloads and binary artifacts
        uses: actions/cache@v5
        with:
          path: |
            C:\vcpkg\downloads
            ${{ github.workspace }}\vcpkg-cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      # The manifest pins builtin-baseline (supply-chain audit); the
      # preinstalled C:\vcpkg clone on the runner image is often older
      # than that commit, and vcpkg then fails with "failed to git show
      # versions/baseline.json". Baselines are always master commits, so
      # a sha-agnostic fetch of master keeps this step valid across
      # future baseline bumps.
      - name: Sync vcpkg clone to the manifest baseline
        run: git -C C:\vcpkg fetch origin master

      - name: Configure CMake (MSVC + Ninja + vcpkg)
        # -G Ninja over the Visual Studio generator: msbuild's
        # parallelism doesn't reliably wait for AUTOUIC to emit ui_*.h
        # before compiling headers that #include them (C1083 failures);
        # Ninja honors autogen edges correctly, same as every Linux job.
        # VCPKG_BINARY_SOURCES uses the workspace-local cache populated
        # by the cache step above. CMAKE_TOOLCHAIN_FILE makes cmake
        # discover Qt6 and the vcpkg-installed deps through one entry
        # point; install-qt-action's QT_ROOT_DIR still steers Qt6 lookup
        # to the official binaries, so the vcpkg toolchain only resolves
        # SDL2 and zstd.
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg-cache,readwrite'
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DKARTEND_BUILD_TESTS=ON `
            -DKARTEND_ENABLE_CCACHE=OFF `
            -DKARTEND_PORTABLE_RELEASE=ON `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build (kartend + tests)
        env:
          SCCACHE_GHA_ENABLED: 'true'
        run: cmake --build build --parallel

      - name: sccache stats
        if: always()
        run: sccache --show-stats

      - name: Run tests
        # QT_QPA_PLATFORM=offscreen mirrors every Linux ctest invocation —
        # the runner has no display server. Output-on-failure so red tests
        # are debuggable from the workflow log without rerunning. The
        # ctest -E exclude regex went from 7 entries down to 0 in three
        # passes; the remaining symlink-shaped tests carry QSKIP-on-
        # Q_OS_WIN gates in-source rather than ctest-level exclusion so
        # the gate stays close to the reason.
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics
        # Kartend-oieo: unified Linux + Windows failure-detail path. The
        # Python helper walks LastTestsFailed.log and re-runs each failed
        # test exe with `-o file,txt` so QTest's per-assertion output
        # bypasses the broken-on-Windows ctest stdout pipe. Identical
        # invocation on both OSes.
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python .scripts/print-failed-tests.py --build-dir build

      - name: Stage with windeployqt + bundled runtime DLLs
        # windeployqt walks the exe's import table and copies Qt DLLs
        # and the platforms/sqldrivers/imageformats/multimedia/... plugin
        # set into the exe's directory. --release picks release-mode
        # DLLs; --no-translations drops Qt's own qm files (kartend ships
        # its own under translations/). The vcpkg-built SDL2 and zstd
        # DLLs aren't on Qt's import table walk path, so copy them by
        # name from the vcpkg installed/ tree.
        run: |
          mkdir dist\kartend
          Copy-Item build\kartend.exe dist\kartend\
          Copy-Item LICENSE dist\kartend\
          Copy-Item readme.md dist\kartend\
          windeployqt --release --no-translations dist\kartend\kartend.exe
          $vcpkgBin = "${{ github.workspace }}\build\vcpkg_installed\x64-windows\bin"
          if (Test-Path "$vcpkgBin\SDL2.dll")  { Copy-Item "$vcpkgBin\SDL2.dll"  dist\kartend\ }
          if (Test-Path "$vcpkgBin\zstd.dll")  { Copy-Item "$vcpkgBin\zstd.dll"  dist\kartend\ }

      - name: Package preview .zip
        # Compress-Archive is PowerShell-native and avoids pulling in 7z.
        # The artifact name carries the run number so multiple downloads
        # from the same branch are distinguishable.
        run: |
          $zipName = "kartend-windows-x64-preview-r${env:GITHUB_RUN_NUMBER}.zip"
          Compress-Archive -Path dist\kartend\* -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_NAME }}
          retention-days: 14
          if-no-files-found: error

  # Kartend-elluw: second Linux Qt version. The build / build-no-zstd /
  # sanitizers / tsan jobs above all use Ubuntu 24.04's apt qt6-base-dev
  # (Qt 6.4.2 — the project's minimum floor). This job pulls a newer Qt via
  # install-qt-action so a regression that only shows up on 6.4 *or* only on a
  # modern Qt is caught before release. Qt6Keychain and SDL2 are optional
  # (find_package(... QUIET) in CMakeLists), so the smoke build doesn't need
  # them; credentials fall back to the plaintext-index path and the gamepad
  # backend is simply absent.
  linux-qt-newer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install build tools + Qt runtime libs
        # No apt qt6-* packages here — they would collide with the
        # install-qt-action Qt below. These are the toolchain + the system
        # libraries Qt's official binaries dlopen at runtime (xcb platform
        # plugin, GL, pulse) plus the archive tools the launch/rom tests need.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache libzstd-dev \
            libgl1-mesa-dev libpulse-dev libxkbcommon-dev \
            libxcb-cursor0 libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 \
            unzip p7zip-full

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.*'
          host: linux
          target: desktop
          arch: linux_gcc_64
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Start dummy pulseaudio
        uses: ./.github/actions/setup-pulseaudio

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-qt68-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-qt68-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=2G
          # PCH-using compiles need this to be cacheable (Kartend-zhodi)
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      - name: Configure CMake
        run: |
          mkdir -p build/qt68
          cd build/qt68
          cmake -G Ninja ../.. \
            -DCMAKE_BUILD_TYPE=Release \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_PORTABLE_RELEASE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: |
          cd build/qt68
          cmake --build . --parallel $(nproc)

      - name: Run Tests
        env:
          QT_QPA_PLATFORM: offscreen
          KARTEND_REQUIRE_ARCHIVE_TOOLS: 1
        run: |
          cd build/qt68
          ctest --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 .scripts/print-failed-tests.py --build-dir build/qt68

      - name: ccache stats
        run: ccache --show-stats

  # Kartend-elluw: macOS smoke build. Mirrors the Windows job's
  # install-qt-action → build → offscreen-ctest shape, adapted to Homebrew +
  # clang. zstd comes from brew; Qt6Keychain and SDL2 are optional
  # (find_package QUIET) so they're omitted. This is the first macOS coverage —
  # it surfaces Q_OS_UNIX-vs-Q_OS_MACOS portability gaps (bundle paths, the
  # macOS keychain backend, case-sensitivity) that the Linux/Windows jobs miss.
  macos-build-test:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - name: Install build deps
        run: brew install ninja ccache zstd

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4.3.1
        with:
          version: '6.8.*'
          host: mac
          target: desktop
          # Universal (arm64 + x86_64) clang build; runs natively on the
          # Apple-Silicon macos-14 runner.
          arch: clang_64
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: ~/Library/Caches/ccache
          key: ${{ runner.os }}-ccache-${{ hashFiles('CMakeLists.txt', '**/*.cmake', '.github/workflows/build.yml') }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          # PCH-using compiles need this to be cacheable (Kartend-zhodi)
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      - name: Configure CMake
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DKARTEND_BUILD_TESTS=ON \
            -DKARTEND_PORTABLE_RELEASE=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build
        run: cmake --build build --parallel $(sysctl -n hw.ncpu)

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --output-on-failure -LE benchmark

      - name: Dump failed-test diagnostics
        if: ${{ failure() }}
        env:
          QT_QPA_PLATFORM: offscreen
        run: python3 .scripts/print-failed-tests.py --build-dir build

      - name: ccache stats
        run: ccache --show-stats
