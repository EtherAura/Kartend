name: CHANGELOG Enforcer

# Fails a change that touches user-visible code (src/ outside tests/) without
# adding a corresponding entry under [Unreleased] in CHANGELOG.md. Doc-only,
# test-only, and CI-only changes are auto-exempted by the path check; anything
# else can opt out with the `no-changelog` label (PRs) or a `[no-changelog]`
# marker in a commit message (pushes). The marker must sit ALONE ON ITS OWN
# LINE — merely mentioning it in prose does not opt out. On a push it exempts
# ONLY the commit carrying it: a marked commit batched with unmarked src/ work
# does not exempt that work.
#
# Rationale: CHANGELOG.md has lagged code several times in the past
# (Kartend-pbed); manual discipline is fragile. This gate is a lightweight,
# overridable backstop that runs in a fraction of a second so it doesn't slow
# the per-PR matrix.
#
# Kartend-78gv3: it used to run on `pull_request` only, which meant it never
# ran at all for work pushed straight to main — and most work here is. The
# gate was not broken (82 green runs), it was bypassed: v0.0.17..main was 23
# linear commits with no PR among them, and two user-visible db fixes
# (Kartend-rctcv, Kartend-neb85) shipped with no CHANGELOG entry as a direct
# result. The push leg below closes that hole. It is necessarily
# after-the-fact — it cannot block a push that already landed — but it turns
# a silent omission into a red run on main while the change is still fresh.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  changelog-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the merge base to diff against the PR's target branch.
          fetch-depth: 0

      - name: Check for CHANGELOG entry
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # Opt-out: PR carries the `no-changelog` label. Empty on a push,
          # where the commit-message marker below serves the same purpose.
          if printf '%s' "$PR_LABELS" | grep -q '"no-changelog"'; then
            echo "::notice::PR has the 'no-changelog' label — skipping CHANGELOG check."
            exit 0
          fi

          # The two triggers need different diff bases.
          if [ "$EVENT_NAME" = "push" ]; then
            # github.event.before is the branch tip prior to the push. It is
            # all-zeros when the ref was just created, and after a force-push
            # it can name a commit this checkout does not have — verify the
            # object exists rather than letting `git diff` abort the run.
            if [ -n "$BEFORE_SHA" ] \
               && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ] \
               && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              RANGE_BASE="$BEFORE_SHA"
            else
              echo "::notice::No usable previous tip for this push (new ref or force-push); falling back to HEAD~1."
              RANGE_BASE="$(git rev-parse 'HEAD~1')"
            fi

            # Push counterpart of the `no-changelog` label. THE MARKER EXEMPTS
            # THE COMMIT THAT CARRIES IT, NOT THE WHOLE PUSH. It used to skip
            # the entire check whenever any commit in the range mentioned it,
            # so one marked doc commit batched alongside real src/ work
            # silently exempted that work — and pushes to main here are
            # usually multi-commit, so the loophole was wide open. Now only
            # the unmarked commits are examined for user-visible changes.
            # THE MARKER MUST BE ALONE ON A LINE. Matching it anywhere in the
            # message meant a commit that merely MENTIONS it opted itself out —
            # this workflow's own commit did exactly that and skipped the check
            # while claiming to be exempt. The case that matters is `git revert`
            # of a marked commit, which copies the original message verbatim and
            # would silently inherit the exemption. Every real marker in this
            # repo's history is already written on its own line.
            UNMARKED_SHAS=""
            for sha in $(git rev-list "${RANGE_BASE}..HEAD"); do
              if git log -1 --format=%B "$sha" | grep -qE '^[[:space:]]*\[no-changelog\][[:space:]]*$'; then
                echo "::notice::$(git log -1 --format='%h %s' "$sha") — carries [no-changelog], exempt."
              else
                UNMARKED_SHAS="${UNMARKED_SHAS} ${sha}"
              fi
            done
            if [ -z "${UNMARKED_SHAS// /}" ]; then
              echo "::notice::Every commit in this push carries [no-changelog] — skipping CHANGELOG check."
              exit 0
            fi
            # Files touched by the unmarked commits only, FIRST-PARENT.
            #
            # Kartend-b2fpv: this used `diff-tree -r -m`, justified as
            # "over-reports rather than under-reports — the safe direction for
            # a gate". It is not safe, it is un-passable. -m diffs a merge
            # against EVERY parent, so a PR-merge whose branch was cut from an
            # older main reports everything main gained since the branch point.
            # Measured on merge 82dfc6c8: first-parent says 1 file, -m says 84.
            # Those 83 extra files include src/, so USER_VISIBLE flips to 1 for
            # work the merge did not introduce, and no edit to THIS push can
            # clear it — the CHANGELOG lines it wants already landed with the
            # branch. (--first-parent does not help here: combined with -m it
            # still emitted all 84.)
            #
            # sha^1..sha is what the commit actually contributed to this ref.
            # Identical to the old output for non-merge commits, verified.
            # A root commit has no ^1, so fall back to --root for it.
            CHANGED=$(for sha in ${UNMARKED_SHAS}; do
              if git rev-parse -q --verify "${sha}^1" >/dev/null 2>&1; then
                git diff -r --name-only "${sha}^1" "$sha"
              else
                git diff-tree -r --no-commit-id --name-only --root "$sha"
              fi
            done | sort -u)
          else
            BASE_SHA="$(git rev-parse "origin/${BASE_REF}")"
            RANGE_BASE="$(git merge-base "${BASE_SHA}" HEAD)"
            CHANGED=$(git diff --name-only "${RANGE_BASE}" HEAD)
          fi

          echo "Changed files considered (since ${RANGE_BASE}):"
          printf '  %s\n' $CHANGED

          # Decide if the change touches user-visible code:
          # - any src/ file outside src/.../tests subdirs counts
          # - tests/, docs/, .github/, .scripts/, CONTRIBUTING.md, CHANGELOG.md
          #   itself, top-level configs are exempt
          USER_VISIBLE=0
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              src/*)
                # Exclude any path that has 'tests' as a path segment
                # (currently kartend has no tests inside src/, but stay
                # future-proof).
                if printf '%s' "$path" | grep -qE '(^|/)tests(/|$)'; then
                  continue
                fi
                USER_VISIBLE=1
                ;;
            esac
          done <<<"$CHANGED"

          if [ "$USER_VISIBLE" -eq 0 ]; then
            echo "::notice::Change doesn't touch user-visible code — CHANGELOG entry not required."
            exit 0
          fi

          # Verify CHANGELOG.md is in the diff AND that the diff added at
          # least one line beneath the [Unreleased] header. A no-op edit
          # (e.g., trailing whitespace) shouldn't count.
          if ! printf '%s\n' "$CHANGED" | grep -qx 'CHANGELOG.md'; then
            echo "::error::Change modifies user-visible code under src/ but does not update CHANGELOG.md."
            echo "Add an entry under [Unreleased]. For refactor-only / internal changes, opt out with the 'no-changelog' label on a PR, or a [no-changelog] marker in the commit message when pushing."
            exit 1
          fi

          # Kartend-b2fpv: the counting pattern was '^\+[^[:space:]]', which
          # demands a non-whitespace character IMMEDIATELY after the '+'. Every
          # continuation line of a wrapped Markdown bullet is indented, so an
          # entry that is expanded or reworded — rather than newly added at
          # column 0 — counted ZERO and the push failed with "no new
          # non-whitespace lines were added" despite a real CHANGELOG edit.
          # This is the actual "push-leg red on main cannot be un-failed"
          # failure; reproduced on 6e52a4e7, whose four added lines are all
          # bullet continuations (old pattern: 0, this one: 4).
          #
          # The check's real intent is "at least one added line carries some
          # non-whitespace", so allow leading indentation before requiring it.
          # Whitespace-only additions still count 0, which is the case the
          # check exists to reject — verified against '+   ', '+' and '+\t'.
          ADDED=$(git diff "${RANGE_BASE}" HEAD -- CHANGELOG.md \
            | awk '/^\+\+\+ / { in_file = 1; next } in_file && /^\+[^+]/ { print }' \
            | grep -cE '^\+[[:space:]]*[^[:space:]]' || true)
          if [ "$ADDED" -eq 0 ]; then
            echo "::error::CHANGELOG.md is modified but no new non-whitespace lines were added. Add a real entry under [Unreleased]."
            exit 1
          fi

          echo "::notice::CHANGELOG.md updated with ${ADDED} new line(s)."
