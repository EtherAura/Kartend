name: Release

# Triggered on tag push (v*). Builds a source tarball with `git archive`,
# computes its sha256, and creates a GitHub Release with auto-generated
# notes and the tarball + checksum file as assets. Closes the loop on
# PKGBUILD's sha256sums=('SKIP') problem — distro packagers can pull the
# checksum directly from the release page.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    # Expose the parsed tag version as a job output so the windows-release
    # job (below) can name its artifacts consistently without re-deriving
    # GITHUB_REF.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=Kartend-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches version across all metadata
        run: |
          set -euo pipefail
          TAG_VERSION="${{ steps.version.outputs.version }}"
          fail=0

          # VERSION file — single source of truth. CMakeLists.txt reads this
          # at configure time, so checking it here is equivalent to checking
          # CMake's project() version.
          VERSION_FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$VERSION_FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=VERSION::VERSION file contents '$VERSION_FILE_VERSION' do not match tag '$TAG_VERSION'"
            fail=1
          fi

          # PKGBUILD pkgver=
          PKGVER="$(awk -F= '/^pkgver=/ { print $2; exit }' packaging/PKGBUILD)"
          if [ "$PKGVER" != "$TAG_VERSION" ]; then
            echo "::error file=packaging/PKGBUILD::pkgver is '$PKGVER', expected '$TAG_VERSION'"
            fail=1
          fi

          # ebuild filename — must be exactly packaging/kartend-<version>.ebuild
          if [ ! -f "packaging/kartend-${TAG_VERSION}.ebuild" ]; then
            echo "::error::Expected ebuild file packaging/kartend-${TAG_VERSION}.ebuild not found (existing: $(ls packaging/kartend-*.ebuild 2>/dev/null || echo none))"
            fail=1
          fi

          # AppStream metainfo — most-recent <release> entry must match
          METAINFO_VERSION="$(awk 'match($0, /<release[[:space:]]+version="([^"]+)"/, a) { print a[1]; exit }' packaging/io.github.EtherAura.Kartend.metainfo.xml)"
          if [ "$METAINFO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=packaging/io.github.EtherAura.Kartend.metainfo.xml::most-recent <release> version is '$METAINFO_VERSION', expected '$TAG_VERSION'"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Tag v$TAG_VERSION does not match all version metadata. Fix the listed files and re-tag."
            exit 1
          fi
          echo "All version metadata agrees on v$TAG_VERSION"

      - name: Create source tarball
        run: |
          git archive \
            --format=tar.gz \
            --prefix=Kartend-${{ steps.version.outputs.version }}/ \
            -o ${{ steps.version.outputs.tarball }} \
            HEAD

      - name: Compute source tarball checksum
        run: |
          sha256sum ${{ steps.version.outputs.tarball }} \
            | tee ${{ steps.version.outputs.tarball }}.sha256

      # ─── Binary .deb via CPack ──────────────────────────────────────────
      # Same package set as build.yml's gcc Release matrix cell; pulseaudio is
      # dropped because the release job doesn't run tests. dpkg-dev is bundled
      # in the runner image so CPACK_DEBIAN_PACKAGE_SHLIBDEPS resolves cleanly.

      - name: Install build dependencies for .deb
        uses: ./.github/actions/install-deps
        with:
          packages: g++ cmake ninja-build qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite libzstd-dev qtkeychain-qt6-dev

      - name: Configure release build
        run: |
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DKARTEND_BUILD_TESTS=OFF \
            -DKARTEND_ENABLE_CCACHE=OFF \
            -DKARTEND_MAINTENANCE=OFF \
            -DKARTEND_PORTABLE_RELEASE=ON

      - name: Build kartend
        run: cmake --build build/release --parallel

      - name: Package .deb
        id: deb
        run: |
          set -euo pipefail
          cd build/release
          cpack -G DEB
          # CPACK_DEBIAN_FILE_NAME=DEB-DEFAULT produces a name like
          # `kartend_0.0.9-1_amd64.deb`; glob it rather than hardcoding the
          # release-number suffix CMake picks.
          DEB_PATH="$(ls kartend_*.deb | head -n 1)"
          if [ -z "${DEB_PATH:-}" ]; then
            echo "::error::cpack -G DEB produced no .deb under build/release/"
            exit 1
          fi
          # Move to the workspace root with the artifact name the release page
          # advertises. action-gh-release uploads under the basename, so
          # making the names predictable here keeps direct-download URLs
          # consistent across releases.
          DEB_OUT="../../kartend_${{ steps.version.outputs.version }}_amd64.deb"
          mv "$DEB_PATH" "$DEB_OUT"
          cd ../..
          sha256sum "kartend_${{ steps.version.outputs.version }}_amd64.deb" \
            | tee "kartend_${{ steps.version.outputs.version }}_amd64.deb.sha256"
          echo "deb=kartend_${{ steps.version.outputs.version }}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "deb_sha=kartend_${{ steps.version.outputs.version }}_amd64.deb.sha256" >> "$GITHUB_OUTPUT"

      - name: Stage packaging recipes
        id: recipes
        # Surface PKGBUILD + the ebuild as release assets so Arch and Gentoo
        # users can wget the canonical recipes for v${{ steps.version.outputs.version }}
        # without cloning. The PKGBUILD's sha256 is filled in by the
        # post-publish step below, so a packaging-snapshot copy is uploaded
        # alongside the live tag-time copy for callers that want the exact
        # bytes that landed at tag time.
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          EBUILD="packaging/kartend-${VERSION}.ebuild"
          if [ ! -f "$EBUILD" ]; then
            echo "::error::Expected $EBUILD not found"
            exit 1
          fi
          # Copy to the workspace root with predictable names that match what
          # downstream packagers actually fetch.
          cp packaging/PKGBUILD .
          cp "$EBUILD" "kartend-${VERSION}.ebuild"
          echo "pkgbuild=PKGBUILD" >> "$GITHUB_OUTPUT"
          echo "ebuild=kartend-${VERSION}.ebuild" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.version.outputs.tarball }}
            ${{ steps.version.outputs.tarball }}.sha256
            ${{ steps.deb.outputs.deb }}
            ${{ steps.deb.outputs.deb_sha }}
            ${{ steps.recipes.outputs.pkgbuild }}
            ${{ steps.recipes.outputs.ebuild }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Update PKGBUILD sha256sums on default branch
        # After publishing, fast-forward main with a commit that points the
        # PKGBUILD source URL at the release-page asset we just uploaded
        # (deterministic `git archive` output) and fills in the sha256.
        # The auto-archive URL (github.com/.../archive/vX.Y.Z.tar.gz) is
        # avoided because its gzip parameters can change without notice and
        # break sha256 verification. This step is idempotent — if PKGBUILD
        # already matches, nothing is committed.
        run: |
          set -euo pipefail
          SHA256="$(awk '{print $1}' ${{ steps.version.outputs.tarball }}.sha256)"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"
          git pull --ff-only origin "$DEFAULT_BRANCH"

          # Switch source URL to the release-page asset (no-op if already there).
          # The URL is line-anchored so a stray match elsewhere can't be touched.
          sed -i -E 's|^source=\("\$\{pkgname\}-\$\{pkgver\}\.tar\.gz::\$\{url\}/archive/v\$\{pkgver\}\.tar\.gz"\)$|source=("${pkgname}-${pkgver}.tar.gz::${url}/releases/download/v${pkgver}/Kartend-${pkgver}.tar.gz")|' packaging/PKGBUILD

          # Replace the sha256sums(...) line with the freshly computed hash.
          sed -i -E "s|^sha256sums=\\('[^']*'\\)|sha256sums=('${SHA256}')|" packaging/PKGBUILD

          if git diff --quiet packaging/PKGBUILD; then
            echo "packaging/PKGBUILD already up to date for v${{ steps.version.outputs.version }}"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/PKGBUILD
          git commit -m "chore(packaging): update PKGBUILD sha256 for v${{ steps.version.outputs.version }}"
          git push origin "$DEFAULT_BRANCH"

  # ─── Windows portable .zip ──────────────────────────────────────────
  # Mirrors build.yml's windows-build-test job: Qt 6.7 LTS via
  # install-qt-action, MSVC via msvc-dev-cmd, SDL2 + zstd via vcpkg
  # manifest mode, Ninja generator, KARTEND_PORTABLE_RELEASE=ON. Stages
  # via windeployqt + co-located vcpkg DLLs, zips, and attaches to the
  # release softprops/action-gh-release already created in the linux
  # job — the action upserts files on an existing release at this tag
  # rather than re-creating it.
  #
  # Qt6Keychain is intentionally absent (vcpkg port collides with the
  # install-qt-action Qt6); scraper creds fall back to plaintext-INI —
  # same caveat documented in build.yml. Tracked under Kartend-ixuy.10.
  windows-release:
    needs: release
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt 6.7 LTS
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtmultimedia qtimageformats'
          cache: true

      - name: Setup MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg downloads and binary artifacts
        uses: actions/cache@v5
        with:
          path: |
            C:\vcpkg\downloads
            ${{ github.workspace }}\vcpkg-cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Configure CMake (MSVC + Ninja + vcpkg)
        # KARTEND_BUILD_TESTS=OFF — the release job doesn't gate on tests
        # (build.yml's windows-build-test already gated this commit). Drops
        # roughly 7 min off this job vs. the test-running build.yml cell.
        env:
          VCPKG_BINARY_SOURCES: 'clear;files,${{ github.workspace }}\vcpkg-cache,readwrite'
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DKARTEND_BUILD_TESTS=OFF `
            -DKARTEND_ENABLE_CCACHE=OFF `
            -DKARTEND_MAINTENANCE=OFF `
            -DKARTEND_PORTABLE_RELEASE=ON `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --parallel

      - name: Stage with windeployqt + bundled runtime DLLs
        run: |
          mkdir dist\kartend
          Copy-Item build\kartend.exe dist\kartend\
          Copy-Item LICENSE dist\kartend\
          Copy-Item readme.md dist\kartend\
          windeployqt --release --no-translations dist\kartend\kartend.exe
          $vcpkgBin = "${{ github.workspace }}\build\vcpkg_installed\x64-windows\bin"
          if (Test-Path "$vcpkgBin\SDL2.dll")  { Copy-Item "$vcpkgBin\SDL2.dll"  dist\kartend\ }
          if (Test-Path "$vcpkgBin\zstd.dll")  { Copy-Item "$vcpkgBin\zstd.dll"  dist\kartend\ }

      - name: Package release .zip + sha256
        # Naming convention matches the source tarball capitalization
        # (Kartend-X.Y.Z-*.zip), not the .deb's lowercase. Get-FileHash's
        # default output format is one line "Algorithm Hash Path"; reformat
        # to "<hash>  <path>" for parity with the existing sha256 sidecars
        # the linux job produces via `sha256sum`.
        id: package
        run: |
          $version  = "${{ needs.release.outputs.version }}"
          $zipName  = "Kartend-$version-windows-x64.zip"
          $shaName  = "$zipName.sha256"
          Compress-Archive -Path dist\kartend\* -DestinationPath $zipName
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          "$hash  $zipName" | Out-File -Encoding ASCII -NoNewline $shaName
          "zip=$zipName"   | Out-File -Encoding ASCII -Append $env:GITHUB_OUTPUT
          "sha=$shaName"   | Out-File -Encoding ASCII -Append $env:GITHUB_OUTPUT

      - name: Attach Windows assets to the release
        # softprops/action-gh-release@v3 upserts files on an existing
        # release at the tag this workflow fired for — the linux job
        # above has already created the release with tarball + .deb +
        # PKGBUILD + ebuild; this call adds the .zip + .sha256 alongside.
        # fail_on_unmatched_files keeps a packaging bug from silently
        # publishing a release without the Windows asset.
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
          fail_on_unmatched_files: true
