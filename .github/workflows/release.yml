name: Release

# Triggered on tag push (v*). Builds a source tarball with `git archive`,
# computes its sha256, and creates a GitHub Release with auto-generated
# notes and the tarball + checksum file as assets. Closes the loop on
# PKGBUILD's sha256sums=('SKIP') problem — distro packagers can pull the
# checksum directly from the release page.

on:
  push:
    tags:
      - 'v*'

# Kartend-itn8a: default the whole workflow to read-only; jobs that publish
# the release or push commits opt in to contents: write individually so a
# future job added here does not silently inherit write access to the repo.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    # Needs write: creates the GitHub Release (action-gh-release) and pushes
    # the post-publish PKGBUILD sha256 commit to the default branch.
    # pull-requests: write backs the PR fallback in the sha256 step — main
    # is a protected branch, and github-actions[bot] is not exempt from its
    # PR requirement, so the direct push gets GH006 (seen on v0.0.13, run
    # 27404798003).
    permissions:
      contents: write
      pull-requests: write
    # Expose the parsed tag version as a job output so the windows-release
    # job (below) can name its artifacts consistently without re-deriving
    # GITHUB_REF.
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=Kartend-$VERSION.tar.gz" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches version across all metadata
        run: |
          set -euo pipefail
          TAG_VERSION="${{ steps.version.outputs.version }}"
          fail=0

          # VERSION file — single source of truth. CMakeLists.txt reads this
          # at configure time, so checking it here is equivalent to checking
          # CMake's project() version.
          VERSION_FILE_VERSION="$(tr -d '[:space:]' < VERSION)"
          if [ "$VERSION_FILE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=VERSION::VERSION file contents '$VERSION_FILE_VERSION' do not match tag '$TAG_VERSION'"
            fail=1
          fi

          # PKGBUILD pkgver=
          PKGVER="$(awk -F= '/^pkgver=/ { print $2; exit }' packaging/PKGBUILD)"
          if [ "$PKGVER" != "$TAG_VERSION" ]; then
            echo "::error file=packaging/PKGBUILD::pkgver is '$PKGVER', expected '$TAG_VERSION'"
            fail=1
          fi

          # ebuild filename — must be exactly packaging/kartend-<version>.ebuild
          if [ ! -f "packaging/kartend-${TAG_VERSION}.ebuild" ]; then
            echo "::error::Expected ebuild file packaging/kartend-${TAG_VERSION}.ebuild not found (existing: $(ls packaging/kartend-*.ebuild 2>/dev/null || echo none))"
            fail=1
          fi

          # vcpkg.json version-string (Kartend-szdbl — drifted to 0.0.9 once
          # because bump-version.sh never touched it; now it does, and this
          # check keeps the pair honest)
          VCPKG_VERSION="$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["version-string"])')"
          if [ "$VCPKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=vcpkg.json::version-string is '$VCPKG_VERSION', expected '$TAG_VERSION'"
            fail=1
          fi

          # AppStream metainfo — most-recent <release> entry must match
          METAINFO_VERSION="$(awk 'match($0, /<release[[:space:]]+version="([^"]+)"/, a) { print a[1]; exit }' packaging/io.github.EtherAura.Kartend.metainfo.xml)"
          if [ "$METAINFO_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=packaging/io.github.EtherAura.Kartend.metainfo.xml::most-recent <release> version is '$METAINFO_VERSION', expected '$TAG_VERSION'"
            fail=1
          fi

          # AppStream metainfo date — bump-version.sh stamps the most-recent
          # <release> date at bump time, which release.yml never validated. A
          # missing/malformed/future date makes appstreamcli warn and looks
          # broken in software centers, so gate it: must be a well-formed
          # calendar date that isn't in the future relative to the build day
          # (UTC). It need not equal the tag day — bumping a few days before
          # tagging is normal.
          METAINFO_DATE="$(awk 'match($0, /<release[[:space:]][^>]*date="([0-9]{4}-[0-9]{2}-[0-9]{2})"/, a) { print a[1]; exit }' packaging/io.github.EtherAura.Kartend.metainfo.xml)"
          if [ -z "$METAINFO_DATE" ]; then
            echo "::error file=packaging/io.github.EtherAura.Kartend.metainfo.xml::most-recent <release> is missing a well-formed date=\"YYYY-MM-DD\" attribute"
            fail=1
          elif ! REL_EPOCH="$(date -u -d "$METAINFO_DATE" +%s 2>/dev/null)"; then
            echo "::error file=packaging/io.github.EtherAura.Kartend.metainfo.xml::most-recent <release> date '$METAINFO_DATE' is not a valid calendar date"
            fail=1
          elif [ "$REL_EPOCH" -gt "$(date -u +%s)" ]; then
            echo "::error file=packaging/io.github.EtherAura.Kartend.metainfo.xml::most-recent <release> date '$METAINFO_DATE' is in the future (today UTC is $(date -u +%Y-%m-%d))"
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::Tag v$TAG_VERSION does not match all version metadata. Fix the listed files and re-tag."
            exit 1
          fi
          echo "All version metadata agrees on v$TAG_VERSION"

      - name: Create source tarball
        run: |
          git archive \
            --format=tar.gz \
            --prefix=Kartend-${{ steps.version.outputs.version }}/ \
            -o ${{ steps.version.outputs.tarball }} \
            HEAD

      - name: Compute source tarball checksum
        run: |
          sha256sum ${{ steps.version.outputs.tarball }} \
            | tee ${{ steps.version.outputs.tarball }}.sha256

      # ─── Binary .deb via CPack ──────────────────────────────────────────
      # Feature-dev package set mirrors build.yml's tested `build (Release,
      # gcc)` cell (libzstd-dev, libarchive-dev, libsdl2-dev, qtkeychain-
      # qt6-dev) so the shipped .deb carries the same optional backends CI
      # tests. Test/tooling-only packages from that cell (pulseaudio, unzip,
      # p7zip-full, ccache, clang, lld) are dropped — this job runs no tests.
      # dpkg-dev is bundled in the runner image so
      # CPACK_DEBIAN_PACKAGE_SHLIBDEPS resolves cleanly.

      - name: Install build dependencies for .deb
        uses: ./.github/actions/install-deps
        with:
          packages: g++ cmake ninja-build qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite libzstd-dev libarchive-dev libsdl2-dev qtkeychain-qt6-dev

      - name: Configure release build
        run: |
          set -euo pipefail
          # The KARTEND_ENABLE_* flags below only *allow* detection — cmake/
          # OptionalBackends.cmake probes with pkg_check_modules(... QUIET),
          # so a missing -dev package silently falls back to the degraded
          # path. Passing them explicitly plus grepping the configure
          # transcript for the STATUS lines the root CMakeLists prints makes
          # the .deb's feature set asserted rather than accidental: a package
          # dropped from the install list above fails the release here
          # instead of shipping a .deb quietly missing features.
          cmake -S . -B build/release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DKARTEND_BUILD_TESTS=OFF \
            -DKARTEND_ENABLE_CCACHE=OFF \
            -DKARTEND_MAINTENANCE=OFF \
            -DKARTEND_PORTABLE_RELEASE=ON \
            -DKARTEND_ENABLE_ZSTD=ON \
            -DKARTEND_ENABLE_LIBARCHIVE=ON \
            -DKARTEND_ENABLE_SDL2_GAMEPAD=ON \
            2>&1 | tee configure.log
          for want in \
            "using SDL2 gamepad backend" \
            "zstd found" \
            "libarchive found"; do
            if ! grep -qF "$want" configure.log; then
              echo "::error::Configure output missing '$want' — the .deb would ship without this feature. Check the apt package list in the install step above."
              exit 1
            fi
          done

      - name: Build kartend
        run: cmake --build build/release --parallel

      - name: Package .deb
        id: deb
        run: |
          set -euo pipefail
          cd build/release
          cpack -G DEB
          # CPACK_DEBIAN_FILE_NAME=DEB-DEFAULT produces a name like
          # `kartend_0.0.9-1_amd64.deb`; glob it rather than hardcoding the
          # release-number suffix CMake picks.
          DEB_PATH="$(ls kartend_*.deb | head -n 1)"
          if [ -z "${DEB_PATH:-}" ]; then
            echo "::error::cpack -G DEB produced no .deb under build/release/"
            exit 1
          fi
          # Move to the workspace root with the artifact name the release page
          # advertises. action-gh-release uploads under the basename, so
          # making the names predictable here keeps direct-download URLs
          # consistent across releases.
          DEB_OUT="../../kartend_${{ steps.version.outputs.version }}_amd64.deb"
          mv "$DEB_PATH" "$DEB_OUT"
          cd ../..
          sha256sum "kartend_${{ steps.version.outputs.version }}_amd64.deb" \
            | tee "kartend_${{ steps.version.outputs.version }}_amd64.deb.sha256"
          echo "deb=kartend_${{ steps.version.outputs.version }}_amd64.deb" >> "$GITHUB_OUTPUT"
          echo "deb_sha=kartend_${{ steps.version.outputs.version }}_amd64.deb.sha256" >> "$GITHUB_OUTPUT"

      - name: Stage packaging recipes
        id: recipes
        # Surface PKGBUILD + the ebuild as release assets so Arch and Gentoo
        # users can wget the canonical recipes for v${{ steps.version.outputs.version }}
        # without cloning. The PKGBUILD's sha256 is filled in by the
        # post-publish step below, so a packaging-snapshot copy is uploaded
        # alongside the live tag-time copy for callers that want the exact
        # bytes that landed at tag time.
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          EBUILD="packaging/kartend-${VERSION}.ebuild"
          if [ ! -f "$EBUILD" ]; then
            echo "::error::Expected $EBUILD not found"
            exit 1
          fi
          # Copy to the workspace root with predictable names that match what
          # downstream packagers actually fetch.
          cp packaging/PKGBUILD .
          cp "$EBUILD" "kartend-${VERSION}.ebuild"
          echo "pkgbuild=PKGBUILD" >> "$GITHUB_OUTPUT"
          echo "ebuild=kartend-${VERSION}.ebuild" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ steps.version.outputs.tarball }}
            ${{ steps.version.outputs.tarball }}.sha256
            ${{ steps.deb.outputs.deb }}
            ${{ steps.deb.outputs.deb_sha }}
            ${{ steps.recipes.outputs.pkgbuild }}
            ${{ steps.recipes.outputs.ebuild }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Update PKGBUILD sha256sums on default branch
        # After publishing, fast-forward main with a commit that points the
        # PKGBUILD source URL at the release-page asset we just uploaded
        # (deterministic `git archive` output) and fills in the sha256.
        # The auto-archive URL (github.com/.../archive/vX.Y.Z.tar.gz) is
        # avoided because its gzip parameters can change without notice and
        # break sha256 verification. This step is idempotent — if PKGBUILD
        # already matches, nothing is committed.
        run: |
          set -euo pipefail
          SHA256="$(awk '{print $1}' ${{ steps.version.outputs.tarball }}.sha256)"
          DEFAULT_BRANCH="${{ github.event.repository.default_branch }}"
          git fetch origin "$DEFAULT_BRANCH"
          git checkout "$DEFAULT_BRANCH"
          git pull --ff-only origin "$DEFAULT_BRANCH"

          # Switch source URL to the release-page asset (no-op if already there).
          # The URL is line-anchored so a stray match elsewhere can't be touched.
          sed -i -E 's|^source=\("\$\{pkgname\}-\$\{pkgver\}\.tar\.gz::\$\{url\}/archive/v\$\{pkgver\}\.tar\.gz"\)$|source=("${pkgname}-${pkgver}.tar.gz::${url}/releases/download/v${pkgver}/Kartend-${pkgver}.tar.gz")|' packaging/PKGBUILD

          # Replace the sha256sums(...) line with the freshly computed hash.
          sed -i -E "s|^sha256sums=\\('[^']*'\\)|sha256sums=('${SHA256}')|" packaging/PKGBUILD

          if git diff --quiet packaging/PKGBUILD; then
            echo "packaging/PKGBUILD already up to date for v${{ steps.version.outputs.version }}"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packaging/PKGBUILD
          git commit -m "chore(packaging): update PKGBUILD sha256 for v${{ steps.version.outputs.version }}"

          # Protected-branch fallback: main requires PRs and the bot is not
          # exempt, so the direct push fails with GH006 (first seen on
          # v0.0.13). Open an auto-merge PR instead — the required checks
          # (script-lint + build) come from build.yml or its no-op
          # companion, after which GitHub merges it unattended.
          if ! git push origin "$DEFAULT_BRANCH"; then
            BRANCH="release/pkgbuild-sha256-v${{ steps.version.outputs.version }}"
            git checkout -b "$BRANCH"
            git push -f origin "$BRANCH"
            gh pr create \
              --base "$DEFAULT_BRANCH" \
              --head "$BRANCH" \
              --title "chore(packaging): PKGBUILD sha256 for v${{ steps.version.outputs.version }}" \
              --body "Automated post-release backfill: direct push to the protected default branch was rejected, so this lands via PR. Generated by release.yml." \
              || true
            # --auto needs the repo's "Allow auto-merge" setting; if it is
            # off (v0.0.13: enablePullRequestAutoMerge refused), the PR
            # still exists and a maintainer merges it — that must not fail
            # the release job, the assets are already published.
            if ! gh pr merge "$BRANCH" --squash --auto --delete-branch; then
              echo "::warning::Backfill PR created but auto-merge unavailable — merge it manually: $(gh pr view "$BRANCH" --json url --jq .url 2>/dev/null || echo 'see open PRs')"
            fi
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ─── Windows portable .zip ──────────────────────────────────────────
  # Mirrors build.yml's windows-build-test job: Qt 6.7 LTS via
  # install-qt-action, MSVC via msvc-dev-cmd, SDL2 + zstd via vcpkg
  # manifest mode, Ninja generator, KARTEND_PORTABLE_RELEASE=ON. Stages
  # via windeployqt + co-located vcpkg DLLs, zips, and attaches to the
  # release softprops/action-gh-release already created in the linux
  # job — the action upserts files on an existing release at this tag
  # rather than re-creating it.
  #
  # Qt6Keychain is intentionally absent (vcpkg port collides with the
  # install-qt-action Qt6); scraper creds fall back to plaintext-INI —
  # same caveat documented in build.yml. Tracked under Kartend-ixuy.10.
  windows-release:
    needs: release
    runs-on: windows-latest
    # Needs write: attaches the Windows assets to the existing release via
    # action-gh-release (uploading release assets requires contents: write).
    # This job also holds SIGNPATH_API_TOKEN, which is exactly why the
    # workflow-level default above is read — a compromised dependency here
    # should not be able to push to the repo.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Shared Windows build pipeline (Kartend-wa4ia): Qt install, MSVC, vcpkg
      # cache + baseline sync, configure, build, and windeployqt staging into
      # dist\kartend — the SAME composite action build.yml's windows-build-test
      # uses, so the two can't drift (they were previously kept in sync only by
      # comments). No tests (the release job doesn't gate on them; build.yml
      # already did, saving ~7 min here) and no sccache; PORTABLE_RELEASE=ON.
      # The SignPath signing + packaging tail below operates on the staged
      # dist\kartend.
      - name: Build + stage kartend
        uses: ./.github/actions/windows-build
        with:
          build-type: Release
          build-tests: 'OFF'
          portable-release: 'ON'
          stage: 'true'

      # ─── SignPath code-signing (kartend.exe) ─────────────────────────
      # SignPath Foundation signs OSS projects' release artifacts with
      # an EV-equivalent cert that clears Windows SmartScreen. The
      # action uploads a GitHub-Actions-artifact to SignPath, waits for
      # SignPath to sign it (auto-approved release policies finish in
      # ~30s; manually-approved policies block until a maintainer
      # clicks Approve in the SignPath UI), then writes the signed file
      # back into output-artifact-directory. Two signing passes total:
      # kartend.exe here (so the signed binary lands inside both the
      # .zip and the NSIS installer downstream), and setup.exe after
      # NSIS builds (so the installer itself is signed).
      #
      # Setup (one-time, on the user side):
      #   1. Apply at https://signpath.org/services/foundation (free
      #      for OSS).
      #   2. Once approved, copy the four values from the SignPath UI:
      #        - API token            → repo SECRET     SIGNPATH_API_TOKEN
      #        - Organization ID      → repo VARIABLE   SIGNPATH_ORGANIZATION_ID
      #        - Project slug         → repo VARIABLE   SIGNPATH_PROJECT_SLUG
      #        - Signing-policy slug  → repo VARIABLE   SIGNPATH_SIGNING_POLICY_SLUG
      #          (typically `release-signing` for stable releases)
      #
      # Until SIGNPATH_API_TOKEN is set, both signing passes no-op and
      # the release publishes unsigned artifacts (SmartScreen-warn-on-
      # first-launch behaviour, same as v0.0.10). The check step emits
      # a warning so the omission is visible in the release run log.
      - name: Check SignPath configuration
        id: signpath_check
        shell: bash
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          if [ -z "$SIGNPATH_API_TOKEN" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SIGNPATH_API_TOKEN not configured; releasing unsigned Windows artifacts. Users will see Windows SmartScreen warning on first launch. See .github/workflows/release.yml header for SignPath setup steps."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload kartend.exe for SignPath signing
        if: steps.signpath_check.outputs.configured == 'true'
        id: upload_kartend_exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-kartend-exe
          path: dist\kartend\kartend.exe
          if-no-files-found: error

      - name: Sign kartend.exe via SignPath
        if: steps.signpath_check.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload_kartend_exe.outputs.artifact-id }}
          wait-for-completion: true
          # Drops the signed file back over the staged unsigned one so
          # the downstream Compress-Archive + makensis steps pick it
          # up without further plumbing.
          output-artifact-directory: dist\kartend

      - name: Package release .zip + sha256
        # Naming convention matches the source tarball capitalization
        # (Kartend-X.Y.Z-*.zip), not the .deb's lowercase. Get-FileHash's
        # default output format is one line "Algorithm Hash Path"; reformat
        # to "<hash>  <path>" for parity with the existing sha256 sidecars
        # the linux job produces via `sha256sum`.
        id: package
        run: |
          $version  = "${{ needs.release.outputs.version }}"
          $zipName  = "Kartend-$version-windows-x64.zip"
          $shaName  = "$zipName.sha256"
          Compress-Archive -Path dist\kartend\* -DestinationPath $zipName
          $hash = (Get-FileHash -Algorithm SHA256 $zipName).Hash.ToLower()
          "$hash  $zipName" | Out-File -Encoding ASCII -NoNewline $shaName
          "zip=$zipName"   | Out-File -Encoding ASCII -Append $env:GITHUB_OUTPUT
          "sha=$shaName"   | Out-File -Encoding ASCII -Append $env:GITHUB_OUTPUT

      - name: Install NSIS
        # NSIS is NOT preinstalled on windows-latest (despite what some
        # docs suggest) — the v0.0.10 release tried to use it and failed
        # with "C:\Program Files (x86)\NSIS\makensis.exe is not
        # recognized". Chocolatey is preinstalled on the runner, so the
        # nsis package is the cheapest path; ~1 min to install. The
        # `refreshenv`-equivalent isn't needed because the next step
        # invokes makensis via its absolute path.
        run: choco install nsis -y --no-progress --no-color

      - name: Build NSIS installer (.exe)
        # Per-machine installer ($PROGRAMFILES64\Kartend, HKLM, UAC) with
        # a Start Menu shortcut. makensis comes from the chocolatey
        # nsis package installed in the step above; it lands at the
        # standard C:\Program Files (x86)\NSIS\makensis.exe path. The
        # .nsi.in template lives in packaging/; this step substitutes
        # @VERSION@/@STAGE_DIR@/@ICON_PATH@ and runs makensis. Paths
        # stay Windows-native (backslashes); no special characters in
        # the substituted values trigger PowerShell's -replace regex
        # behaviour (`$` backreferences, etc.).
        #
        # sha256 computation moved to a separate step after the
        # SignPath setup.exe signing pass below — signing changes the
        # bytes, so the hash has to be taken on the final artifact.
        id: installer
        run: |
          $version   = "${{ needs.release.outputs.version }}"
          $stageDir  = "${{ github.workspace }}\dist\kartend"
          $iconPath  = "${{ github.workspace }}\src\assets\icon.ico"
          $nsiIn     = "packaging\kartend-installer.nsi.in"
          $nsiOut    = "kartend-installer.nsi"
          (Get-Content $nsiIn -Raw) `
            -replace '@KARTEND_VERSION@',   $version `
            -replace '@KARTEND_STAGE_DIR@', $stageDir `
            -replace '@KARTEND_ICON_PATH@', $iconPath `
            | Set-Content -Encoding UTF8 $nsiOut
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          & $makensis /V2 $nsiOut
          if ($LASTEXITCODE -ne 0) { throw "makensis failed with exit $LASTEXITCODE" }

          $exeName = "Kartend-$version-windows-x64-setup.exe"
          if (-not (Test-Path $exeName)) { throw "Expected $exeName but it wasn't produced" }
          "exe=$exeName" | Out-File -Encoding ASCII -Append $env:GITHUB_OUTPUT

      - name: Upload setup.exe for SignPath signing
        if: steps.signpath_check.outputs.configured == 'true'
        id: upload_setup_exe
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-setup-exe
          path: ${{ steps.installer.outputs.exe }}
          if-no-files-found: error

      - name: Sign setup.exe via SignPath
        if: steps.signpath_check.outputs.configured == 'true'
        uses: signpath/github-action-submit-signing-request@c92b958760219087e01f8d67a1669ed57afe2627 # v2.3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload_setup_exe.outputs.artifact-id }}
          wait-for-completion: true
          # Drops the signed installer back over the unsigned one at
          # the workspace root where Attach Windows assets below picks
          # it up via steps.installer.outputs.exe.
          output-artifact-directory: .

      - name: Compute sha256 for setup.exe
        # Has to happen AFTER the SignPath pass above (signing changes
        # the bytes). Always runs — the unsigned path needs a sha256
        # too. id: installer_sha so the Attach step can pluck the
        # filename without recomputing.
        id: installer_sha
        run: |
          $exeName = "${{ steps.installer.outputs.exe }}"
          $shaName = "$exeName.sha256"
          $hash    = (Get-FileHash -Algorithm SHA256 $exeName).Hash.ToLower()
          "$hash  $exeName" | Out-File -Encoding ASCII -NoNewline $shaName
          "sha=$shaName" | Out-File -Encoding ASCII -Append $env:GITHUB_OUTPUT

      - name: Attach Windows assets to the release
        # softprops/action-gh-release@v3 upserts files on an existing
        # release at the tag this workflow fired for — the linux job
        # above has already created the release with tarball + .deb +
        # PKGBUILD + ebuild; this call adds the .zip / .exe installer /
        # sha256 sidecars alongside. fail_on_unmatched_files keeps a
        # packaging bug from silently publishing a release without the
        # Windows assets.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
            ${{ steps.installer.outputs.exe }}
            ${{ steps.installer_sha.outputs.sha }}
          fail_on_unmatched_files: true
