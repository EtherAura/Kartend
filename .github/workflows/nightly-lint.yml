name: Nightly Lint Sweep

# Full advisory static-analysis sweep, demoted here from build.yml's
# maintenance-check job: the all-checks clang-tidy pass over every TU plus
# IWYU and cppcheck cost >2 CPU-hours per run and produce advisory output
# only, so running them on every push to main bought latency, not
# enforcement. Pushes to main now run a cheap(er) ENFORCING curated-check
# clang-tidy gate inside maintenance-check instead; this nightly keeps the
# full breadth — the modernize/readability/misc/google clang-tidy families,
# IWYU, cppcheck, and a Qt-specific clazy (level0+level1) pass — visible
# without taxing every merge. Its logs are the feedstock for the quarterly
# lint review.
#
# Advisory by design: this sweep runs build.sh WITHOUT --format-check, so it
# exits 0 on all lint findings — including a promoted (WarningsAsErrors) check
# firing in the advisory pass. Only compile errors or infra failures turn it
# red. Enforcement of the promoted checks lives in the ENFORCING curated-check
# gate on every push to main (build.yml maintenance-check), which is where a
# promoted-check regression is actually caught; this nightly's job is breadth
# and trend data, surfaced via the step-summary counts and the uploaded log
# artifact for the quarterly review.

on:
  schedule:
    # 04:37 UTC daily. Off-the-hour minute avoids the congested GitHub-hosted
    # runner queue windows (same rationale as nightly-tsan's 03:17), and the
    # offset from that run keeps the two nightlies from queueing at once.
    - cron: '37 4 * * *'
  # Manual trigger for on-demand sweeps (e.g. before a quarterly review, or
  # to validate a .clang-tidy change without waiting a day).
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nightly-lint
  cancel-in-progress: false

jobs:
  lint-sweep:
    runs-on: ubuntu-24.04
    # The full sweep was the slowest job in build.yml (150-min budget there);
    # give the nightly a little extra cold-cache headroom on top.
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        # Same toolchain set as build.yml's maintenance-check job, plus
        # clazy — the Qt-specific analyzer only this nightly runs.
        uses: ./.github/actions/install-deps
        with:
          packages: clang cmake ninja-build lld ccache qt6-base-dev qt6-multimedia-dev qt6-tools-dev libqt6sql6-sqlite libarchive-dev qtkeychain-qt6-dev clang-tidy clang-format-19 cppcheck iwyu clazy jq

      - name: Cache ccache
        # Content-addressed primary key; restore-keys deliberately fall back
        # to the maintenance-check caches so the nightly compile phase is
        # mostly warm (mirrors nightly-tsan's reuse of the per-PR tsan
        # cache). No github.run_id keys — a unique-per-run key would force a
        # fresh cache write each night and evict PR caches.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # Cache-key policy, and the accepted staleness that comes with
          # it, are documented once at the ccache step in build.yml
          # (Kartend-pcc65). Do not chase the hit rate here without
          # reading that first.
          path: ~/.cache/ccache
          key: ${{ runner.os }}-ccache-maintenance-nightly-${{ hashFiles('CMakeLists.txt', '**/*.cmake') }}
          restore-keys: |
            ${{ runner.os }}-ccache-maintenance-nightly-
            ${{ runner.os }}-ccache-maintenance-
            ${{ runner.os }}-ccache-

      - name: Configure ccache
        run: |
          ccache --set-config=cache_dir=$HOME/.cache/ccache
          ccache --set-config=max_size=2G
          # PCH-using compiles need this sloppiness to be cacheable (same
          # setting as every other ccache-using job).
          ccache --set-config=sloppiness=pch_defines,time_macros
          ccache --zero-stats

      - name: Run full maintenance sweep (advisory)
        # --analysis=full is the build.sh default; spelled out so the
        # contrast with maintenance-check's --analysis=tidy / --analysis=off
        # invocations is greppable. --tests keeps the ~430 test TUs in the
        # compdb so the analysis covers the hand-maintained test tree too.
        run: bash .scripts/build.sh --maintenance --tests --analysis=full

      - name: ccache stats
        run: ccache --show-stats

      - name: Run clazy sweep (advisory)
        # Qt-specific analysis the clang-tidy/IWYU/cppcheck trio doesn't
        # cover: container detachments, connect pitfalls, QString allocation
        # churn, Q_PROPERTY hygiene. level0+level1 are the low-false-positive
        # tiers; promote zero-hit checks later via the same ratchet pattern
        # the curated clang-tidy gate uses. src/ TUs only (taken from the
        # compile DB, so excluded/generated TUs never 'no compile command'
        # here) — clazy targets the shipping Qt code; tests/ stays with the
        # clang-tidy/cppcheck passes above.
        #
        # Ubuntu 24.04's clazy 1.11 runs a clang-15 frontend, which rejects
        # the -std=gnu++23 spelling the clang-18 compile DB records (clang 15
        # only knows gnu++2b), so point it at a rewritten copy. Verified
        # 2026-07-07: with that one rewrite clang 15 parses this codebase's
        # TUs cleanly (PCH is already off under KARTEND_MAINTENANCE, so no
        # PCH-version mismatch either).
        #
        # Advisory: findings (some at error severity) make clazy-standalone
        # exit non-zero, so only the analysis pipeline gets `|| true`; a
        # missing compile DB or broken jq still fails the step, keeping the
        # sweep's "only compile errors or infra failures turn it red"
        # contract. The log lands next to the other tools' logs so the
        # summary step and artifact upload below pick it up unchanged.
        run: |
          set -o pipefail
          COMPDB=build/ninja-maintenance/compile_commands.json
          LOGS=build/ninja-maintenance/logs
          CLAZY_DB="$(mktemp -d)"
          jq 'map(if has("command") then .command |= gsub("-std=gnu\\+\\+23"; "-std=gnu++2b") else . end)' \
            "$COMPDB" > "$CLAZY_DB/compile_commands.json"
          jq -r --arg src "$PWD/src/" \
            '.[].file | select(startswith($src) and endswith(".cpp"))' \
            "$CLAZY_DB/compile_commands.json" | sort -u > "$CLAZY_DB/tus.txt"
          xargs -r -n1 -P"$(nproc)" clazy-standalone -p "$CLAZY_DB" --checks=level0,level1 \
            < "$CLAZY_DB/tus.txt" > "$LOGS/clazy.log" 2>&1 || true

      - name: Summarize finding counts
        if: ${{ always() }}
        run: |
          LOGS=build/ninja-maintenance/logs
          {
            echo "## Nightly lint sweep"
            echo
            echo "Advisory finding counts (full logs in the run artifact):"
            echo
            echo '| tool | finding lines |'
            echo '|---|---|'
            for tool in clang-tidy clazy iwyu cppcheck; do
              log="$LOGS/$tool.log"
              if [ -f "$log" ]; then
                case "$tool" in
                  clang-tidy) n="$(grep -cE '^/.*\.(cpp|h):[0-9]+:[0-9]+: warning:' "$log" || true)" ;;
                  # clazy emits some checks at error severity, so count both;
                  # keying on the -Wclazy tag keeps real compile errors out.
                  clazy)      n="$(grep -cE '^/.*\.(cpp|h):[0-9]+:[0-9]+: (warning|error): .*\[-Wclazy-' "$log" || true)" ;;
                  iwyu)       n="$(grep -cE 'should (add|remove) these lines:' "$log" || true)" ;;
                  cppcheck)   n="$(grep -cE ': (error|warning|style|performance|portability):' "$log" || true)" ;;
                esac
                echo "| $tool | ${n:-0} |"
              else
                echo "| $tool | (log missing) |"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload analysis logs
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-lint-logs-${{ github.run_id }}
          path: build/ninja-maintenance/logs/
          retention-days: 90
          if-no-files-found: warn
